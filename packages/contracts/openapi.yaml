  /api/v1/public/verify:
    post:
      operationId: verifySerial
      tags: [verification]
      summary: Verify product authenticity (public, no login)
      description: >
        Rate limited per IP (IPv4 per address, IPv6 per /64; 429 with
        Retry-After). The server sets an anonymous mg_vid cookie to fingerprint
        scans. The response never includes the internal serial status; a
        malformed code returns NOT_FOUND right away (still recorded for
        counterfeit hotspots).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicVerifyRequest"
            examples:
              storeUnit:
                summary: Genuine unit at the Jakarta Selatan store
                description: GENUINE_FIRST on the first check, GENUINE_REPEAT with the first check's date and city afterwards.
                value:
                  code: AT2JXMFN8BS93A4D
                  lat: -6.2441
                  lng: 106.8003
                  accuracy_m: 20
              farAway:
                summary: Same unit, minutes later from Makassar
                description: IMPOSSIBLE_TRAVEL. From the same browser (same mg_vid cookie) it is only an internal anomaly; from another browser or device the answer becomes SUSPICIOUS.
                value:
                  code: AT2JXMFN8BS93A4D
                  lat: -5.1477
                  lng: 119.4327
                  accuracy_m: 20
              unshippedCentral:
                summary: Unit that never left the central warehouse
                description: 'SUSPICIOUS (NON_SELLABLE_SCAN): a consumer cannot hold a unit that was never shipped, so its label likely leaked.'
                value:
                  code: MVTW3YW6H7GAJW8S
              unknownCode:
                summary: Code that was never issued
                description: NOT_FOUND; counted in the UNKNOWN_CODE hotspot per region per day.
                value:
                  code: ZZZZZZZZZZZZZZZZ
              typedByHand:
                summary: Code typed by hand
                description: Lowercase and dashes are normalized (I/L read as 1, O as 0) before the lookup.
                value:
                  code: at2j-xmfn-8bs9-3a4d
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicVerifyResponse"
        "400": *serialProblem
        "422": *serialProblem
        "429": *serialProblem
