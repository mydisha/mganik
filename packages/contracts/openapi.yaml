        scans:
          type: array
          items:
            $ref: "#/components/schemas/TraceScan"
    VerifyResult:
      type: string
      enum: [GENUINE_FIRST, GENUINE_REPEAT, SUSPICIOUS, NOT_FOUND, RECALLED]
    PublicVerifyRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          maxLength: 512
        lat:
          type: number
          minimum: -90
          maximum: 90
          description: Wajib berpasangan dengan lng
        lng:
          type: number
          minimum: -180
          maximum: 180
        accuracy_m:
          type: integer
          minimum: 0
          maximum: 100000
    PublicVerifyResponse:
      type: object
      required: [result]
      properties:
        result:
          $ref: "#/components/schemas/VerifyResult"
        product:
          type: object
          description: Hanya untuk GENUINE_* dan RECALLED
          required: [name, lot_no, exp_date]
          properties:
            name:
              type: [string, "null"]
            lot_no:
              type: [string, "null"]
            exp_date:
              type: [string, "null"]
              format: date-time
        first_verified_at:
          type: string
          format: date-time
        first_verified_city:
          type: string
    LoyaltyClaimRequest:
      type: object
      additionalProperties: false
      required: [code, pin]
      properties:
        code:
          type: string
          maxLength: 64
        pin:
          type: string
          maxLength: 64
          description: PIN 10 karakter di dalam kemasan
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        accuracy_m:
          type: integer
          minimum: 0
          maximum: 100000
    LoyaltyClaimStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, REVERSED]
    LoyaltyClaimResponse:
      type: object
      required: [claim_id, status, points, available_at, replayed]
      properties:
        claim_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/LoyaltyClaimStatus"
        points:
          type: integer
          format: int64
        available_at:
          type: string
          format: date-time
        replayed:
          type: boolean
    LoyaltyBalanceResponse:
      type: object
      required: [available, pending]
      properties:
        available:
          type: integer
          format: int64
        pending:
          type: integer
          format: int64
    ReviewClaimRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT, REVERSE]
          description: APPROVE/REJECT untuk klaim PENDING; REVERSE (clawback) untuk klaim APPROVED
        note:
          type: string
          maxLength: 1000
          description: Alasan; wajib untuk REVERSE
    ReviewClaimResponse:
      type: object
      required: [claim_id, status, points, risk_score, risk_reasons, review_required, available_at, decided_at]
      properties:
        claim_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/LoyaltyClaimStatus"
        points:
          type: integer
          format: int64
        risk_score:
          type: integer
          minimum: 0
          maximum: 100
        risk_reasons:
          type: array
          items:
            type: object
            required: [rule, weight]
            properties:
              rule:
                type: string
              weight:
                type: integer
        review_required:
          type: boolean
        available_at:
          type: string
          format: date-time
        decided_at:
          type: [string, "null"]
          format: date-time
    # ==== [/serialization] ====

    # ==== [inventory] ====
    InventoryBalanceItem:
      type: object
      required: [location_id, location_code, location_name, location_type, sync_state, product_id, sku, product_name,
        physical_qty, reserved_qty, quarantine_qty, available_qty, online_buffer_qty, online_atp, updated_at]
      properties:
        location_id: { type: string, format: uuid }
        location_code: { type: string }
        location_name: { type: string }
        location_type: { type: string, description: "CENTRAL_WH, HUB, OWN_STORE, ..." }
        sync_state: { type: string, enum: [NOT_TRACKED, ONLINE, OFFLINE] }
        product_id: { type: string, format: uuid }
        sku: { type: string }
        product_name: { type: string }
        physical_qty: { type: integer, format: int64 }
        reserved_qty: { type: integer, format: int64 }
        quarantine_qty: { type: integer, format: int64 }
        available_qty: { type: integer, format: int64, description: physical − reserved − quarantine }
        online_buffer_qty: { type: integer, format: int64 }
        online_atp: { type: integer, format: int64, description: "Stok yang boleh dijanjikan ke online (0 kalau OFFLINE)" }
        updated_at: { type: string, format: date-time }
    InventoryBalancePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InventoryBalanceItem" }
        next_cursor:
          type: [string, "null"]
          description: null = halaman terakhir
    InventoryAdjustmentRequest:
      type: object
      additionalProperties: false
      required: [location_id, product_id, qty_delta, reason]
      properties:
        location_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        qty_delta: { type: integer, format: int64, minimum: -1000000, maximum: 1000000, description: "≠ 0; negatif = kurang" }
        reason: { type: string, minLength: 3, maxLength: 500, description: "Wajib, 3-500 karakter (unicode)" }
    InventoryQuarantineRequest:
      type: object
      additionalProperties: false
      required: [location_id, product_id, qty, direction, reason]
      properties:
        location_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        qty: { type: integer, format: int64, minimum: 1, maximum: 1000000 }
        direction: { type: string, enum: [IN, OUT] }
        reason: { type: string, minLength: 3, maxLength: 500 }
    InventoryMovement:
      type: object
      required: [id, location_id, product_id, movement_type, physical_delta, reserved_delta, quarantine_delta,
        ref_type, ref_id, reason, actor_type, actor_id, occurred_at, recorded_at]
      properties:
        id: { type: string, format: uuid }
        location_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        movement_type: { type: string }
        physical_delta: { type: integer, format: int64 }
        reserved_delta: { type: integer, format: int64 }
        quarantine_delta: { type: integer, format: int64 }
        ref_type: { type: string }
        ref_id: { type: string, format: uuid }
        reason: { type: [string, "null"] }
        actor_type: { type: string, enum: [USER, DEVICE, SYSTEM, CONSUMER] }
        actor_id: { type: [string, "null"], format: uuid }
        occurred_at: { type: string, format: date-time }
        recorded_at: { type: string, format: date-time }
    InventoryBalance:
      type: object
      required: [location_id, product_id, physical_qty, reserved_qty, quarantine_qty, available_qty, updated_at]
      properties:
        location_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        physical_qty: { type: integer, format: int64 }
        reserved_qty: { type: integer, format: int64 }
        quarantine_qty: { type: integer, format: int64 }
        available_qty: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }
    InventoryStockChangeResponse:
      type: object
      required: [movement, balance, duplicate]
      properties:
        movement: { $ref: "#/components/schemas/InventoryMovement" }
        balance: { $ref: "#/components/schemas/InventoryBalance" }
        duplicate: { type: boolean, description: "true = replay Idempotency-Key, tanpa mutasi baru" }
    OrderStatus:
      type: string
      enum: [PENDING_PAYMENT, PAID, FULFILLING, SHIPPED, DELIVERED, COMPLETED, EXPIRED, NEEDS_ACTION, CANCELLED, RETURNED]
    OrderCreateLine:
      type: object
      additionalProperties: false
      required: [product_id, qty]
      properties:
        product_id: { type: string, format: uuid }
        qty: { type: integer, format: int64, minimum: 1, maximum: 1000 }
    OrderCreateRequest:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        channel_code: { type: string, maxLength: 32, description: "Kosong = D2C_WEB; hanya channel bertipe D2C" }
        lines:
          type: array
          minItems: 1
          maxItems: 50
          description: Satu produk hanya boleh muncul sekali
          items: { $ref: "#/components/schemas/OrderCreateLine" }
        note: { type: string, maxLength: 500 }
    OrderCancelRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    OrderFulfillLineSerials:
      type: object
      additionalProperties: false
      required: [order_line_id, serial_unit_ids]
      properties:
        order_line_id: { type: string, format: uuid }
        serial_unit_ids:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string, format: uuid }
    OrderFulfillRequest:
      type: object
      additionalProperties: false
      properties:
        serials:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/OrderFulfillLineSerials" }
    OrderLine:
      type: object
      required: [id, product_id, sku, product_name, qty, unit_price, discount, serial_unit_ids]
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        sku: { type: string }
        product_name: { type: string }
        qty: { type: integer, format: int64 }
        unit_price: { type: integer, format: int64, description: Rupiah utuh }
        discount: { type: integer, format: int64 }
        serial_unit_ids:
          type: array
          items: { type: string, format: uuid }
    OrderReservation:
      type: object
      required: [id, order_line_id, location_id, product_id, qty, status, expires_at, created_at, closed_at, close_reason]
      properties:
        id: { type: string, format: uuid }
        order_line_id: { type: string, format: uuid }
        location_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        qty: { type: integer, format: int64 }
        status: { type: string, enum: [ACTIVE, COMMITTED, RELEASED, EXPIRED, PREEMPTED] }
        expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        closed_at: { type: [string, "null"], format: date-time }
        close_reason: { type: [string, "null"] }
    OrderHistoryEntry:
      type: object
      required: [from_status, to_status, reason, actor_type, at]
      properties:
        from_status:
          oneOf:
            - $ref: "#/components/schemas/OrderStatus"
            - type: "null"
        to_status: { $ref: "#/components/schemas/OrderStatus" }
        reason: { type: [string, "null"] }
        actor_type: { type: string, enum: [USER, DEVICE, SYSTEM, CONSUMER] }
        at: { type: string, format: date-time }
    OrderPayment:
      type: object
      required: [id, provider, provider_ref, amount, currency, status, received_at]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        provider_ref: { type: string }
        amount: { type: integer, format: int64 }
        currency: { type: string }
        status: { type: string, enum: [PENDING, SUCCEEDED, FAILED, REFUNDED] }
        received_at: { type: string, format: date-time }
    Order:
      type: object
      required: [id, channel_code, external_ref, status, currency, subtotal, discount, total, placed_at, paid_at,
        payment_expires_at, fulfillment_location_id, metadata, lines, reservations, history, payments]
      properties:
        id: { type: string, format: uuid }
        channel_code: { type: string }
        external_ref: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/OrderStatus" }
        currency: { type: string }
        subtotal: { type: integer, format: int64 }
        discount: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        placed_at: { type: string, format: date-time }
        paid_at: { type: [string, "null"], format: date-time }
        payment_expires_at: { type: [string, "null"], format: date-time }
        fulfillment_location_id: { type: [string, "null"], format: uuid }
        metadata:
          type: object
          additionalProperties: true
          description: >
            Catatan dan penanda operasional, misal note, refund_required,
            refund_reason, refund_payment_ids, needs_action_reason,
            expired_reason, split_fulfillment, payload_hash (impor marketplace).
        lines:
          type: array
          items: { $ref: "#/components/schemas/OrderLine" }
        reservations:
          type: array
          items: { $ref: "#/components/schemas/OrderReservation" }
        history:
          type: array
          items: { $ref: "#/components/schemas/OrderHistoryEntry" }
        payments:
          type: array
          items: { $ref: "#/components/schemas/OrderPayment" }
    PaymentWebhookRequest:
      type: object
      additionalProperties: false
      required: [provider_ref, order_id, amount, currency, status]
      properties:
        provider_ref: { type: string, maxLength: 128, description: "ID event/transaksi di provider; kunci idempotensi" }
        order_id: { type: string, format: uuid }
        amount: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        status: { type: string, enum: [SUCCEEDED, FAILED] }
        method: { type: string, maxLength: 32 }
    PaymentWebhookResponse:
      type: object
      required: [payment_id, order_id, order_status, outcome, duplicate]
      properties:
        payment_id: { type: [string, "null"], format: uuid }
        order_id: { type: string, format: uuid }
        order_status: { $ref: "#/components/schemas/OrderStatus" }
        outcome:
          type: string
          enum: [PAID, LATE_PAYMENT_REALLOCATED, LATE_PAYMENT_NEEDS_ACTION, PAYMENT_FAILED, REFUND_REQUIRED, ALREADY_PROCESSED]
        duplicate: { type: boolean }
    MarketplaceOrderLine:
      type: object
      additionalProperties: false
      required: [sku, qty]
      properties:
        sku: { type: string, maxLength: 64 }
        qty: { type: integer, format: int64, minimum: 1, maximum: 1000 }
        unit_price: { type: integer, format: int64, minimum: 0, maximum: 1000000000000 }
        discount: { type: integer, format: int64, minimum: 0, description: "≤ qty × unit_price" }
    MarketplaceOrderRequest:
      type: object
      additionalProperties: false
      required: [channel_code, external_ref, lines]
      properties:
        channel_code: { type: string, maxLength: 32, description: "Channel bertipe MARKETPLACE (SHOPEE, TOKOPEDIA, TIKTOK_SHOP)" }
        external_ref: { type: string, maxLength: 128 }
        placed_at: { type: string, format: date-time }
        currency: { type: string, minLength: 3, maxLength: 3, default: IDR }
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/MarketplaceOrderLine" }
    MarketplaceImportResponse:
      type: object
      required: [duplicate, order]
      properties:
        duplicate: { type: boolean }
        order: { $ref: "#/components/schemas/Order" }
    # ==== [/inventory] ====

    # ==== [pos] ====
    # ==== [/pos] ====

    # ==== [commandcenter] ====
    CCRunoutLevel:
      type: string
      enum: [CRITICAL, WARNING, INSUFFICIENT_DATA, OK]
    CCAnomalyStatus:
      type: string
      enum: [OPEN, ACK, RESOLVED, FALSE_POSITIVE]
    CCSeverity:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    CCSummaryResponse:
      type: object
      required: [generated_at, runout, stock, anomalies, conflicts, stores]
      properties:
        generated_at: { type: string, format: date-time }
        runout:
          type: object
          required: [window_days, critical_items, critical_locations, warning_items, warning_locations, insufficient_data_items, earliest_runout_date]
          properties:
            window_days: { type: integer }
            critical_items: { type: integer, format: int64 }
            critical_locations: { type: integer, format: int64 }
            warning_items: { type: integer, format: int64 }
            warning_locations: { type: integer, format: int64 }
            insufficient_data_items: { type: integer, format: int64 }
            earliest_runout_date:
              type: [string, "null"]
              format: date
              description: Tanggal habis paling dekat di antara item CRITICAL/WARNING (zona lokasi)
        stock:
          type: object
          required: [out_of_stock_items, out_of_stock_locations]
          properties:
            out_of_stock_items: { type: integer, format: int64, description: "SKU-lokasi milik sendiri dengan available 0" }
            out_of_stock_locations: { type: integer, format: int64 }
        anomalies:
          type: object
          required: [open_total, open_by_severity, top_party]
          properties:
            open_total: { type: integer, format: int64 }
            open_by_severity:
              type: object
              required: [LOW, MEDIUM, HIGH, CRITICAL]
              properties:
                LOW: { type: integer, format: int64 }
                MEDIUM: { type: integer, format: int64 }
                HIGH: { type: integer, format: int64 }
                CRITICAL: { type: integer, format: int64 }
            top_party:
              description: Party dengan anomali OPEN terbanyak
              oneOf:
                - $ref: "#/components/schemas/CCPartyCount"
                - type: "null"
        conflicts:
          type: object
          required: [open_total]
          properties:
            open_total: { type: integer, format: int64 }
        stores:
          type: object
          required: [total, offline]
          properties:
            total: { type: integer, format: int64 }
            offline: { type: integer, format: int64, description: "Toko dengan sync_state OFFLINE" }
    CCPartyCount:
      type: object
      required: [party_id, party_name, open_count]
      properties:
        party_id: { type: string, format: uuid }
        party_name: { type: string }
        open_count: { type: integer, format: int64 }
    CCStockItem:
      type: object
      required: [location_id, location_code, location_name, location_type, sync_state, last_heartbeat_at, product_id, sku, product_name,
                 physical_qty, reserved_qty, quarantine_qty, available_qty, is_estimate, updated_at]
      properties:
        location_id: { type: string, format: uuid }
        location_code: { type: string }
        location_name: { type: string }
        location_type: { type: string }
        sync_state: { type: string, enum: [NOT_TRACKED, ONLINE, OFFLINE] }
        last_heartbeat_at: { type: [string, "null"], format: date-time }
        product_id: { type: string, format: uuid }
        sku: { type: string }
        product_name: { type: string }
        physical_qty: { type: integer, format: int64 }
        reserved_qty: { type: integer, format: int64 }
        quarantine_qty: { type: integer, format: int64 }
        available_qty: { type: integer, format: int64 }
        is_estimate:
          type: boolean
          description: true untuk lokasi bukan milik sendiri; angkanya perkiraan dari sell-in tercatat
        updated_at: { type: string, format: date-time }
    CCStockPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CCStockItem" }
        next_cursor: { type: [string, "null"] }
    CCRunoutItem:
      type: object
      required: [location_id, location_code, location_name, location_type, product_id, sku, product_name, available_qty, is_estimate,
                 sold_qty, history_days, avg_daily_sales, days_of_inventory, runout_date, level, reasons, has_policy, min_qty,
                 lead_time_days, safety_days]
      properties:
        location_id: { type: string, format: uuid }
        location_code: { type: string }
        location_name: { type: string }
        location_type: { type: string }
        product_id: { type: string, format: uuid }
        sku: { type: string }
        product_name: { type: string }
        available_qty: { type: integer, format: int64 }
        is_estimate: { type: boolean }
        sold_qty: { type: integer, format: int64, description: "Unit terjual dalam jendela 28 hari" }
        history_days:
          type: [integer, "null"]
          minimum: 1
          maximum: 28
          description: Pembagi rata-rata = hari sejak mutasi pertama (lokasi, produk); null tanpa penjualan
        avg_daily_sales: { type: [number, "null"], description: "null tanpa riwayat penjualan" }
        days_of_inventory: { type: [number, "null"], description: "null tanpa riwayat penjualan" }
        runout_date: { type: [string, "null"], format: date, description: "Hari ini (zona lokasi) + DOI; null kalau DOI null atau > 3650" }
        level: { $ref: "#/components/schemas/CCRunoutLevel" }
        reasons:
          type: array
          items:
            type: string
            enum: [STOCK_OUT, BELOW_LEAD_TIME, BELOW_SAFETY_DAYS, BELOW_MIN_QTY, NO_SALES_HISTORY, SHORT_HISTORY, NO_POLICY]
        has_policy: { type: boolean, description: "false = tanpa stock_policies; hanya aturan stok habis yang berlaku" }
        min_qty: { type: [integer, "null"], format: int64 }
        lead_time_days: { type: [integer, "null"] }
        safety_days: { type: [integer, "null"] }
    CCRunoutResponse:
      type: object
      required: [items, next_cursor, window_days, generated_at]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CCRunoutItem" }
        next_cursor: { type: [string, "null"] }
        window_days: { type: integer }
        generated_at: { type: string, format: date-time }
    CCAnomalyItem:
      type: object
      required: [id, rule_code, rule_name, severity, status, subject_type, subject_id, party_id, party_name, region_code, region_name,
                 hit_count, evidence, first_seen_at, last_seen_at, resolved_by, resolved_at, resolution_note, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        rule_code: { type: string }
        rule_name: { type: string }
        severity: { $ref: "#/components/schemas/CCSeverity" }
        status: { $ref: "#/components/schemas/CCAnomalyStatus" }
        subject_type: { type: string }
        subject_id: { type: [string, "null"], format: uuid }
        party_id: { type: [string, "null"], format: uuid }
        party_name: { type: [string, "null"] }
        region_code: { type: [string, "null"] }
        region_name: { type: [string, "null"] }
        hit_count: { type: integer }
        evidence: { type: object, additionalProperties: true }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        resolved_by: { type: [string, "null"], format: uuid }
        resolved_at: { type: [string, "null"], format: date-time }
        resolution_note: { type: [string, "null"] }
        version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CCAnomalyPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CCAnomalyItem" }
        next_cursor: { type: [string, "null"] }
    CCAnomalyUpdateRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ACK, RESOLVED, FALSE_POSITIVE] }
        note:
          type: [string, "null"]
          maxLength: 1000
          description: >
            Wajib untuk RESOLVED dan FALSE_POSITIVE (disimpan sebagai resolution_note dan di
            audit). Pada ACK boleh diisi, tetapi hanya dicatat di audit_logs.reason, tidak
            disimpan di anomali. Spasi di tepi dibuang. Karakter kontrol (NUL, ESC, CR, DEL, C1)
            ditolak 422 invalid_characters; baris baru dan tab diizinkan.
    CCConflictItem:
      type: object
      required: [id, kind, status, location_id, location_code, location_name, product_id, sku, product_name, qty, pos_transaction_id,
                 reservation_id, order_id, serial_unit_id, resolution, details, resolved_by, resolved_at, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [OFFLINE_SALE_PREEMPT, SERIAL_DOUBLE_SALE, STOCK_DISCREPANCY] }
        status: { type: string, enum: [OPEN, AUTO_RESOLVED, RESOLVED] }
        location_id: { type: string, format: uuid }
        location_code: { type: string }
        location_name: { type: string }
        product_id: { type: string, format: uuid }
        sku: { type: string }
        product_name: { type: string }
        qty: { type: [integer, "null"], format: int64 }
        pos_transaction_id: { type: [string, "null"], format: uuid }
        reservation_id: { type: [string, "null"], format: uuid }
        order_id: { type: [string, "null"], format: uuid }
        serial_unit_id: { type: [string, "null"], format: uuid }
        resolution: { type: [string, "null"] }
        details: { type: object, additionalProperties: true }
        resolved_by: { type: [string, "null"], format: uuid }
        resolved_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    CCConflictPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CCConflictItem" }
        next_cursor: { type: [string, "null"] }
    CCLeakageItem:
      type: object
      required: [party_id, party_name, coverage_mode, total_scans, located_scans, unlocated_scans, judged_scans, unjudged_scans,
                 out_of_territory_scans, leak_ratio,
                 sample_too_small, test_buy_scans, test_buy_hits, above_baseline, alert]
      properties:
        party_id: { type: string, format: uuid }
        party_name: { type: string }
        coverage_mode:
          type: [string, "null"]
          enum: [NATIONAL, SELECTED, null]
          description: null = distributor belum punya wilayah resmi yang berlaku (rasio tidak dihitung)
        total_scans: { type: integer, format: int64 }
        located_scans: { type: integer, format: int64 }
        unlocated_scans: { type: integer, format: int64 }
        judged_scans: { type: integer, format: int64, description: "Scan yang bisa dinilai dalam/luar wilayah (dasar rasio)" }
        unjudged_scans:
          type: integer
          format: int64
          description: Scan berwilayah yang tidak bisa dinilai (wilayah scan lebih kasar dari wilayah resmi, atau tanpa wilayah resmi saat scan)
        out_of_territory_scans: { type: [integer, "null"], format: int64 }
        leak_ratio: { type: [number, "null"], description: "Luar wilayah ÷ scan yang dinilai, 4 desimal" }
        sample_too_small: { type: boolean }
        test_buy_scans: { type: integer, format: int64 }
        test_buy_hits: { type: integer, format: int64, description: "Scan TEST_BUY di luar wilayah (sinyal kuat)" }
        above_baseline: { type: boolean }
        alert: { type: boolean }
    CCLeakageResponse:
      type: object
      required: [items, next_cursor, window_days, from, to, min_scans, baseline_ratio]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CCLeakageItem" }
        next_cursor: { type: [string, "null"] }
        window_days: { type: integer }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        min_scans: { type: integer, format: int64 }
        baseline_ratio: { type: number }
    # ==== [/commandcenter] ====

    LiveResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadyResponse:
      type: object
      required: [status, schema_version, checked_at]
      properties:
        status:
          type: string
          const: ready
        schema_version:
          type: integer
          format: int64
        checked_at:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Kode stabil untuk dipetakan ke pesan di frontend
        detail:
          type: string
        request_id:
          type: string
        errors:
          type: array
          description: Diisi untuk 422 validation_failed
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: Path JSON, mis. lines[0].qty
        code:
          type: string
        message:
          type: string
