          application/json:
            schema:
              $ref: "#/components/schemas/LoyaltyClaimRequest"
            examples:
              soldStoreUnit:
                summary: 'Claim unit #49 after selling it in /pos'
                description: Points are granted once. Before the unit is sold the answer is 409 claim_not_allowed; a second claim from another account is 409 already_claimed.
                value:
                  code: AT2JXMFN8BS93A4D
                  pin: WNPFPPNWP7
                  lat: -6.2615
                  lng: 106.8106
                  accuracy_m: 25
              unsoldUnit:
                summary: Correct PIN on a unit still in the warehouse
                description: 409 claim_not_allowed plus an anomaly (points harvested before a sale).
                value:
                  code: MVTW3YW6H7GAJW8S
                  pin: 6QVEQ8Q4G1
              wrongPin:
                summary: Wrong PIN
                description: 422 invalid_code_or_pin; the fifth wrong PIN locks the unit (423 claim_locked).
                value:
                  code: G39TJN8TBJ44G7MP
                  pin: '0000000000'
      responses:
        "200":
          description: Same claim sent again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoyaltyClaimResponse"
        "201":
          description: Claim recorded
