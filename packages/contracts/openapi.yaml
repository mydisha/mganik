  # ==== [/serialization] ====

  # ==== [inventory] stok, order, pembayaran ====
  # Route staff butuh sesi + permission; lokasi di luar scope principal = 403.
  # POST pembuat data memakai header Idempotency-Key (1-255 karakter ASCII).
  # Teks bebas (reason, note, external_ref, sku, provider_ref, ...) dengan
  # karakter kontrol selain \n dan \t ditolak 422 invalid_characters.
  # Webhook pembayaran & impor marketplace tanpa sesi, ditandatangani HMAC:
  #   X-Mganik-Timestamp: <unix detik>  (toleransi ±5 menit)
  #   X-Mganik-Signature: v1=<hex HMAC-SHA256(WEBHOOK_SECRET, timestamp + "." + body)>
  /api/v1/inventory/balances:
    get:
      operationId: listInventoryBalances
      summary: Stock balance per (location, product) with online ATP
      description: >
        Keyset pagination on (location_id, product_id) through an opaque
        cursor. A principal with SELECTED scope only sees its own locations.
        online_atp = available − online_buffer_qty, and 0 when the location's
        POS is OFFLINE. Permission inventory.read.
      tags: [inventory]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: location_id, in: query, schema: { type: string, format: uuid } }
        - { name: product_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
      responses:
        "200":
          description: One page of balances
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryBalancePage" }
        # Anchor YAML dipakai ulang di seluruh bagian [inventory] (marker hanya
        # mengizinkan path & schema, bukan components.responses/parameters).
        "401": &invProblem
          description: Domain error (problem+json); see the code field
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403": *invProblem
        "422": *invProblem
  /api/v1/inventory/adjustments:
    post:
      operationId: createInventoryAdjustment
      summary: Stock count adjustment (ADJUST_COUNT ±) with a required reason, audited
      description: >
        Same Idempotency-Key with the same body = 200 duplicate (no new
        movement); a different body = 422 idempotency_key_reused. Reducing more
        than available = 409 insufficient_stock. Permission inventory.adjust.
      tags: [inventory]
      security: [{ sessionCookie: [] }]
      parameters:
        - &invIdemKey
          name: Idempotency-Key
          in: header
          required: true
          description: Client idempotency key (1-255 visible ASCII characters). Reuse a key to see the stored response replayed; use a new key for a new request.
          example: demo-key-001
          schema: { type: string, minLength: 1, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryAdjustmentRequest" }
            example:
              location_id: 1666259e-6aa4-5d50-b297-5fd2887e7719
              product_id: 37a8fc14-037a-5a0b-a220-3c212c909693
              qty_delta: -1
              reason: Kemasan rusak saat stock opname
      responses:
        "201":
          description: Movement recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryStockChangeResponse" }
        "200":
          description: Idempotency-Key replay (duplicate=true)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryStockChangeResponse" }
        "400": *invProblem
        "401": *invProblem
        "403": *invProblem
        "409": *invProblem
        "422": *invProblem
  /api/v1/inventory/quarantine:
    post:
      operationId: moveInventoryQuarantine
      summary: Move stock into quarantine (IN) or release it (OUT), audited
      description: Permission inventory.quarantine. Idempotency-Key semantics match adjustments.
      tags: [inventory]
      security: [{ sessionCookie: [] }]
      parameters:
        - *invIdemKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryQuarantineRequest" }
            example:
              location_id: 13792935-de43-5ce7-b15b-82c7a923b1fc
              product_id: 37a8fc14-037a-5a0b-a220-3c212c909693
              qty: 5
              direction: IN
              reason: Segel rusak, menunggu QC
      responses:
        "201":
          description: Movement recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryStockChangeResponse" }
        "200":
          description: Idempotency-Key replay (duplicate=true)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryStockChangeResponse" }
        "400": *invProblem
        "401": *invProblem
        "403": *invProblem
        "409": *invProblem
        "422": *invProblem
  /api/v1/orders:
    post:
      operationId: createOrder
      summary: Create a D2C order and reserve stock (PENDING_PAYMENT)
      description: >
        Prices come from the channel price list. All lines are reserved at one
        location (central warehouse first, then other locations with
        online_fulfillment_enabled), all-or-nothing, with a RESERVATION_TTL
        payment deadline. Idempotency-Key is required: replay = identical
        response plus header Idempotent-Replayed: true, different body = 422
        idempotency_key_reused, still processing = 409 idempotency_in_progress.
        Insufficient stock = 409 out_of_stock with errors[] per line (field
        lines[i].qty, code insufficient_stock or not_at_single_location).
        Permission order.create.
      tags: [orders]
      security: [{ sessionCookie: [] }]
      parameters:
        - *invIdemKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderCreateRequest" }
            examples:
              d2c:
                summary: D2C order, 2 boxes of tea
                value:
                  channel_code: D2C_WEB
                  lines:
                  - product_id: 37a8fc14-037a-5a0b-a220-3c212c909693
                    qty: 2
                  note: Pesanan demo
              oversell:
                summary: More than the stock anywhere
                description: 409 out_of_stock with errors[] per line; nothing is reserved.
                value:
                  lines:
                  - product_id: 37a8fc14-037a-5a0b-a220-3c212c909693
                    qty: 1000
      responses:
        "201":
          description: Order created (or replayed)
          headers:
            Idempotent-Replayed:
              description: "true when the response is a replay"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": *invProblem
        "401": *invProblem
        "403": *invProblem
        "409": *invProblem
        "422": *invProblem
  /api/v1/orders/{id}:
    get:
      operationId: getOrder
      summary: Full order (lines, reservations, status history, payments)
      description: Permission order.read; a SELECTED principal only sees orders from its locations.
      tags: [orders]
      security: [{ sessionCookie: [] }]
      parameters:
        - &invOrderID
          name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": *invProblem
        "403": *invProblem
        "404": *invProblem
  /api/v1/orders/{id}/cancel:
    post:
      operationId: cancelOrder
      summary: Cancel an order and release its reservations
      description: >
        Allowed from PENDING_PAYMENT, PAID, or NEEDS_ACTION. A paid order is
        flagged with metadata.refund_required. Cancelling a CANCELLED order
        returns 200 unchanged. Permission order.cancel.
      tags: [orders]
      security: [{ sessionCookie: [] }]
      parameters:
        - *invOrderID
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderCancelRequest" }
            example:
              reason: Pelanggan membatalkan pesanan
      responses:
        "200":
          description: Order after cancellation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": *invProblem
        "403": *invProblem
        "404": *invProblem
        "409": *invProblem
        "422": *invProblem
  /api/v1/orders/{id}/fulfill:
    post:
      operationId: fulfillOrder
      summary: Fulfill a PAID order (COMMIT_SALE, PAID → FULFILLING → SHIPPED)
      description: >
        Optional body: unit serials per line are recorded in order_line_serials
        (a unit can be sold only once, otherwise 409 serial_already_sold). A
        SHIPPED order returns 200 unchanged. Requires permission order.fulfill
        and every reservation location in scope.
      tags: [orders]
      security: [{ sessionCookie: [] }]
      parameters:
        - *invOrderID
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderFulfillRequest" }
            example: {}
      responses:
        "200":
          description: Order after shipping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": *invProblem
        "403": *invProblem
        "404": *invProblem
        "409": *invProblem
        "422": *invProblem
  /api/v1/webhooks/payments/mock:
    post:
      operationId: paymentWebhookMock
      summary: Mock payment webhook (HMAC signature, idempotent per provider_ref)
      description: >
        Amount and currency must equal the order total. PENDING_PAYMENT → PAID.
        Late payment (EXPIRED): stock is reserved again → PAID, or NEEDS_ACTION
        plus refund when stock is gone. A resend returns 200 ALREADY_PROCESSED.
        See "Signed endpoints" in the API description for a shell command that signs the request.
      tags: [payments]
      security: []
      parameters:
        - &invWebhookTimestamp
          name: X-Mganik-Timestamp
          in: header
          required: true
          description: Unix seconds; must be within ±5 minutes of server time (401 stale_timestamp)
          schema: { type: string, pattern: "^[0-9]+$" }
        - &invWebhookSignature
          name: X-Mganik-Signature
          in: header
          required: true
          description: v1=<hex HMAC-SHA256(WEBHOOK_SECRET, timestamp + "." + body)> (401 invalid_signature)
          schema: { type: string, pattern: "^v1=[0-9a-f]{64}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentWebhookRequest" }
            example:
              provider_ref: PAY-DEMO-0001
              order_id: 00000000-0000-0000-0000-000000000000
              amount: 66000
              currency: IDR
              status: SUCCEEDED
              method: QRIS
      responses:
        "200":
          description: Event processed (or duplicate)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentWebhookResponse" }
        "401": *invProblem
        "404": *invProblem
        "409": *invProblem
        "422": *invProblem
        "503": *invProblem
  /api/v1/channels/marketplace/orders:
    post:
      operationId: importMarketplaceOrder
      summary: Import a paid marketplace order (HMAC signature)
      description: >
        Deduplicated per (channel_code, external_ref): re-importing the same
        body = 200 duplicate with the same order; a different body = 409
        external_ref_conflict. The order starts as PAID; with insufficient stock
        the order is still created and moves to NEEDS_ACTION (not rejected).
        See "Signed endpoints" in the API description for a shell command that signs the request.
      tags: [orders]
      security: []
      parameters:
        - *invWebhookTimestamp
        - *invWebhookSignature
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarketplaceOrderRequest" }
            example:
              channel_code: SHOPEE
              external_ref: SHP-DEMO-0001
              currency: IDR
              lines:
              - sku: DEMO-TEH-BAG20
                qty: 1
                unit_price: 33000
                discount: 0
      responses:
        "201":
          description: New order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketplaceImportResponse" }
        "200":
          description: Duplicate (existing order)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketplaceImportResponse" }
        "401": *invProblem
        "409": *invProblem
        "422": *invProblem
        "503": *invProblem
  # ==== [/inventory] ====

  # ==== [pos] ====
  # POS offline-first (Pilar C, Kasus 4). Route device memakai
  # Authorization: Bearer <token device> (opsional X-Cashier-Id: kasir yang
  # login; kasir di luar lokasi device = 403 cashier_not_allowed). Token dicabut
  # = 401 invalid_token. Route staff butuh sesi + permission; lokasi di luar
  # scope permission itu = 403.
  /api/v1/pos/devices:
    post:
      operationId: provisionPosDevice
      summary: Provision a POS device (token and signing key, returned once)
      description: >
        Permission pos.device.manage at the target location (scope per
        permission). The location must be an active own store (OWN_STORE),
        otherwise 422 location_not_store or location_not_found. The random
        256-bit bearer token and signing key are returned ONLY in this response
        (Cache-Control: no-store); the server stores the token's SHA-256 and the
        signing key encrypted with AES-256-GCM (HKDF subkey of PII_ENC_KEY, AAD =
        device id). There is no Idempotency-Key replay (a replay would mean
        storing the plaintext token): a retry that creates a duplicate device is
        resolved by revoking the extra device. A NOT_TRACKED store becomes
        OFFLINE until its first heartbeat. Audited.
      tags: [pos]
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PosDeviceCreateRequest" }
            example:
              location_id: 05dc2ae7-585d-5895-9dbf-2d8db39d6b97
              name: Kasir 1 Toko Bandung
      responses:
        "201":
          description: Device created; store token and signing_key on the device (they cannot be retrieved again)
          headers:
            Cache-Control:
              description: no-store
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosDeviceProvisioned" }
        "400": &posProblem
          description: Domain error (problem+json); see the code field
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": *posProblem
        "403": *posProblem
        "422": *posProblem
    get:
      operationId: listPosDevices
      summary: List POS devices at locations within pos.device.manage scope
      description: Keyset pagination on (created_at, id), newest first. Never includes the token or signing key.
      tags: [pos]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: location_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
      responses:
        "200":
          description: One page of devices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosDevicePage" }
        "401": *posProblem
        "403": *posProblem
        "422": *posProblem
  /api/v1/pos/devices/{id}/revoke:
    post:
      operationId: revokePosDevice
      summary: Revoke a POS device (its token is rejected with 401 immediately)
      description: >
        Permission pos.device.manage at the device's location (out of scope =
        403, missing = 404). Revoking an already revoked device returns its
        current state (idempotent, no second audit entry). Body optional.
        Limitation: unsynced offline sales from a revoked device cannot come in
        through /pos/sync (token 401); recovery is manual (export the outbox or
        receipts, recorded by ops after verification). Make sure the device's
        last heartbeat reported pending_count 0 before revoking. A store with no
        ACTIVE device left returns to NOT_TRACKED.
      tags: [pos]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PosDeviceRevokeRequest" }
            example:
              reason: Tablet kasir hilang
      responses:
        "200":
          description: Device with status REVOKED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosDevice" }
        "401": *posProblem
        "403": *posProblem
        "404": *posProblem
        "422": *posProblem
  /api/v1/pos/bootstrap:
    get:
      operationId: getPosBootstrap
      summary: Reference data for offline operation (device)
      description: >
        One consistent snapshot (REPEATABLE READ): active product catalog, the
        current POS price list and its version (send it as price_list_version
        in transactions), the location's stock snapshot, the first page of UNIT
        IN_STOCK serials at the location (2,000 per page, continue with
        /pos/bootstrap/serials?cursor=), cashiers allowed to log in (active
        users with pos.sync scope at this location who have a PIN) with their
        argon2id pos_pin_hash for local login, server_time, and offline limits.
        Trade-off: PIN hashes on the device can be brute-forced offline if the
        device is stolen; the impact is limited because the server still checks
        the (revocable) device token and the cashier_id of every transaction.
        Cache-Control: no-store.
      tags: [pos]
      security: [{ deviceToken: [] }]
      responses:
        "200":
          description: Bootstrap data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosBootstrap" }
        "401": *posProblem
        "403": *posProblem
  /api/v1/pos/bootstrap/serials:
    get:
      operationId: listPosBootstrapSerials
      summary: Next page of UNIT IN_STOCK serials at the device's location
      tags: [pos]
      security: [{ deviceToken: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
      responses:
        "200":
          description: One page of serials (ordered by code)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosSerialPage" }
        "401": *posProblem
        "403": *posProblem
        "422": *posProblem
  /api/v1/pos/heartbeat:
    post:
      operationId: postPosHeartbeat
      summary: Device heartbeat (recommended every heartbeat_interval_seconds)
      description: >
        Always updates pos_devices.last_seen_at. The store only becomes ONLINE
        (locations.sync_state and last_heartbeat_at, monotonic) when
        pending_count = 0 and the server sees no seq gap for this device;
        otherwise online_blocked_reason is pending_count_missing,
        pending_outbox, or missing_seqs and the store's ONLINE state is not
        extended. Reason: while offline sales are unsynced, the server's stock
        for the store is wrong, so the store's online ATP must stay 0. Client
        order after connectivity returns: drain the outbox (/pos/sync), then
        send a heartbeat with pending_count 0. A worker marks the location
        OFFLINE when there has been no "clean" heartbeat for longer than
        heartbeat_timeout_seconds (default 120).
      tags: [pos]
      security: [{ deviceToken: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PosHeartbeatRequest" }
            example:
              pending_count: 0
      responses:
        "200":
          description: Status after the heartbeat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosHeartbeatResponse" }
        "401": *posProblem
        "403": *posProblem
        "413": *posProblem
        "422": *posProblem
  /api/v1/pos/sync:
    post:
      operationId: syncPosTransactions
      summary: Reconcile offline POS transactions (idempotent per transaction)
      description: |
        Try this flow through the cashier app at `/pos`, which signs every transaction,
        stores it offline, and syncs it (see "Signed endpoints" in the API description).

        At most sync_max_batch (500) transactions per batch and
        sync_max_body_bytes (5 MiB) per body. Transactions are processed in
        device_seq order, each in its own database transaction; one failure does
        not stop the others. A sale is a fact: it is NEVER rejected because of
        stock or serials ("facts beat promises").

        **Identity:** client_txn_id (UUID, v7 recommended) and device_seq
        (integer 1..2^53-1, monotonic per device, taken inside an IndexedDB
        transaction). An item whose identity cannot be read is answered REJECTED
        invalid_payload without being stored (match it through
        `results[].index`); other items are still processed. 400/422 for the
        whole batch only when the batch structure is broken or it exceeds
        sync_max_batch. The same id/seq twice in one batch is treated as a
        resend.

        **The signature is checked before anything is stored.** A transaction
        with a wrong signature (or one that cannot be canonicalized) is not
        stored and does not occupy its client_txn_id or device_seq: resending a
        correctly signed version is still accepted. A wrong signature is
        recorded as a POS_PAYLOAD_MISMATCH anomaly (one per device per day,
        hit_count).

        **Canonicalization for signature and payload_hash** (subset of RFC
        8785/JCS):
        1. Take the transaction object as is and drop the top-level `signature`
           member. Every other member (including unknown ones) is signed.
        2. Sort object keys recursively by UTF-16 code unit (same as the
           built-in JS `Array.prototype.sort()`); duplicate keys are rejected.
        3. Serialize without whitespace; escape strings exactly like
           `JSON.stringify` (\" \\ \b \f \n \r \t, other control characters as
           lowercase \u00xx, everything else including non-ASCII written as is
           in UTF-8); array order is preserved.
        4. Numbers are integers only, |n| <= 2^53-1 (money in whole rupiah), no
           fractions or exponents. A lone UTF-16 surrogate is written as \udxxx
           like JSON.stringify (the signature still verifies), but the
           transaction is REJECTED invalid_payload (stored, no anomaly).

        JS reference:
        ```js
        const canon = (v) => Array.isArray(v) ? '[' + v.map(canon).join(',') + ']'
          : v !== null && typeof v === 'object'
            ? '{' + Object.keys(v).sort().map((k) => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}'
            : JSON.stringify(v);
        const { signature, ...rest } = txn;
        const bytes = new TextEncoder().encode(canon(rest));
        const key = await crypto.subtle.importKey('raw', hexToBytes(signingKey),
          { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
        txn.signature = bytesToHex(new Uint8Array(await crypto.subtle.sign('HMAC', key, bytes)));
        ```
        signature = lowercase hex HMAC-SHA256(signing_key, canonical);
        server payload_hash = SHA-256(canonical).

        **Per-transaction status** (`results[].status`):
        - ACCEPTED: recorded (stock, serials, COMPLETED POS order, payments).
        - ACCEPTED_WITH_CONFLICT: recorded, plus `detail.conflicts`
          (OFFLINE_SALE_PREEMPT: an online reservation lost to the sale;
          STOCK_DISCREPANCY: recorded physical stock was short;
          SERIAL_DOUBLE_SALE: serial is registered but already sold, at another
          location, not a unit, or a different product, and is left unchanged;
          SERIAL_UNREGISTERED: serial is not registered, anomaly
          POS_UNREGISTERED_SERIAL; PAYMENT_REF_DUPLICATE: approval_ref already
          used by another transaction, payment recorded as PENDING).
        - REJECTED: no stock or order effect; `detail.reason`:
          - stored (resend = DUPLICATE, seq filled): invalid_payload (validly
            signed), cashier_not_allowed (unknown cashier or no pos.sync role at
            the location), unknown_product, validation_failed,
            invalid_characters, total_mismatch, payment_insufficient;
          - idempotency_key_reused (client_txn_id already used with a different
            body; the original transaction stands; the new seq gets a REJECTED
            tombstone row so ack can advance; anomaly POS_PAYLOAD_MISMATCH);
          - not stored: invalid_signature, invalid_payload that cannot be
            verified (broken identity or not canonicalizable),
            device_seq_reused (seq already used by another transaction;
            anomaly).
        - DUPLICATE: already processed; `result` and `detail` are the original
          result, byte-identical to the first response.
        - RETRY: transient failure (stock_contended or temporary_failure), not
          stored; resend later.
        Remove from the outbox for ACCEPTED, ACCEPTED_WITH_CONFLICT, and
        DUPLICATE; move REJECTED to a "needs attention" list; keep RETRY.
        `detail.message` and `detail.errors[].message` are Indonesian text that
        can be shown to the cashier.

        **Flags** (`detail.flags`, the transaction stays ACCEPTED): PRICE_STALE
        (price_list_version is not the version in effect at transaction time),
        OFFLINE_TOO_LONG (happened more than offline_limit_seconds before it was
        received), CLOCK_SKEW (|server_time − client_time| > tolerance),
        FUTURE_TIMESTAMP, PRICE_MISMATCH (unit_price differs from the price list
        in effect at transaction time), HIGH_DISCOUNT (line discount >
        high_discount_percent), OFFLINE_VALUE_LIMIT (total >
        offline_value_limit; plus anomaly), ZERO_TOTAL, CASHIER_INACTIVE
        (cashier has a role at the location but the user was deactivated by
        sync time; the sale is still a fact; plus anomaly),
        SERIAL_INVALID_FORMAT (scanned code is not in serial format; listed in
        `detail.invalid_serials`, no anomaly). Serial codes are normalized like
        consumer verification (uppercase, no spaces or hyphens, I/L→1, O→0).
        The device's occurred_at is stored as is; ledger and order use
        occurred_at + clock_skew_ms (capped at the receive time).

        **ack_up_to_seq** = the largest N such that seq 1..N of this device is
        stored (any stored result, including REJECTED and tombstones).
        missing_seqs = seqs not yet received between ack_up_to_seq+1 and the
        highest stored seq (max 500; missing_seqs_truncated when cut off). An
        empty batch may be sent to ask for the ack.
      tags: [pos]
      security: [{ deviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PosSyncRequest" }
      responses:
        "200":
          description: Per-transaction results (ordered by device_seq) and ack status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosSyncResponse" }
        "400": *posProblem
        "401": *posProblem
        "403": *posProblem
        "409": *posProblem
        "413": *posProblem
        "422": *posProblem
        "503": *posProblem
  /api/v1/cc/conflicts/{id}/resolve:
    post:
      operationId: resolveAllocationConflict
      summary: Close an allocation conflict OPEN → RESOLVED
      description: >
        Permission conflict.resolve at the conflict's location (CanAt). A
        conflict outside scope returns 404 conflict_not_found (same as
        /cc/anomalies/{id}). Only status OPEN; AUTO_RESOLVED or RESOLVED = 409
        invalid_transition. Two concurrent requests: exactly one wins.
        ORDER_CANCELLED is valid only when the related order is already
        CANCELLED or EXPIRED (otherwise, including conflicts without an order,
        409 resolution_not_applicable). The note is stored in
        details.resolution_note and audit_logs.
      tags: [commandcenter]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConflictResolveRequest" }
            example:
              resolution: CUSTOMER_COMPENSATED
              note: Pelanggan online diberi voucher, pesanan dikirim dari gudang pusat
      responses:
        "200":
          description: Conflict after closing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CCConflictItem" }
        "400": *posProblem
        "401": *posProblem
        "403": *posProblem
        "404": *posProblem
        "409": *posProblem
        "422": *posProblem
  # ==== [/pos] ====

  # ==== [commandcenter] ====
  # Read model Supply Chain Command Center (Pilar D). Semua endpoint butuh
  # permission cc.read (PATCH anomali: anomaly.resolve) dan data difilter ke
  # lokasi dalam scope pemanggil. List memakai pagination keyset: kirim
  # next_cursor dari respons sebelumnya sebagai `cursor`. Semua timestamp
  # dikirim dalam UTC (akhiran Z).
  /api/v1/cc/summary:
    get:
      operationId: getCommandCenterSummary
      summary: Compact facts for the Command Center summary sentence
      description: >
        Runout and stock-out counts cover own locations only; stock at partner
        locations is an estimate and is excluded from the summary (it still
        appears in /cc/runout).
      tags: [commandcenter]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Structured numbers; the UI composes the sentence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CCSummaryResponse"
        "401": &ccUnauthorized
          description: Not logged in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403": &ccForbidden
          description: Missing permission, or a location filter outside scope
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cc/stock:
    get:
      operationId: listCommandCenterStock
      summary: Stock balance per location and product (physical, reserved, quarantine, available)
      description: Stock at locations that are not owned (partner warehouse, marketplace) is flagged is_estimate.
      tags: [commandcenter]
      security: [{ sessionCookie: [] }]
      parameters:
        - &ccLimit
          name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - &ccCursor
          name: cursor
          in: query
          description: next_cursor from the previous page (opaque)
          schema: { type: string, maxLength: 1024 }
        - &ccLocationType
          name: location_type
          in: query
          description: location_types code, e.g. CENTRAL_WH, HUB, OWN_STORE, PARTNER_WH
          schema: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        - &ccLocationId
          name: location_id
          in: query
          schema: { type: string, format: uuid }
        - &ccProductId
          name: product_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: One page of balances, ordered by location code then SKU
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CCStockPage"
        "401": *ccUnauthorized
        "403": *ccForbidden
        "422": &ccInvalid
          description: Invalid query parameter (limit, cursor, filter)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cc/runout:
    get:
      operationId: listCommandCenterRunout
      summary: Days of inventory and estimated stock-out date per location and product
      description: >
        DOI = available ÷ average daily sales (DIRECT_SALE + COMMIT_SALE over the last 28 days
        ÷ history_days). history_days = days since the first movement for (location, product),
        1..28, so a new SKU is not divided by 28 days; history under 7 days gets reason
        SHORT_HISTORY. DOI is rounded to 2 decimals once and that value decides the level.
        CRITICAL when DOI < lead_time_days or stock is out while the product still sells;
        WARNING when DOI < lead_time_days + safety_days or available < min_qty;
        INSUFFICIENT_DATA when there is no sales history (DOI null, never invented). Most
        critical first.
      tags: [commandcenter]
      security: [{ sessionCookie: [] }]
      parameters:
        - *ccLimit
        - *ccCursor
        - *ccLocationType
        - *ccLocationId
        - *ccProductId
        - name: level
          in: query
          schema:
            $ref: "#/components/schemas/CCRunoutLevel"
      responses:
        "200":
          description: One page of runout rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CCRunoutResponse"
        "401": *ccUnauthorized
        "403": *ccForbidden
        "422": *ccInvalid
  /api/v1/cc/anomalies:
    get:
      operationId: listCommandCenterAnomalies
      summary: Distribution and stock anomaly queue, newest first
      description: >
        A location-scoped caller (SELECTED) only sees anomalies with subject_type LOCATION at
        its locations; distribution anomalies (party or territory) are for ALL scope only.
      tags: [commandcenter]
      security: [{ sessionCookie: [] }]
      parameters:
        - *ccLimit
        - *ccCursor
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/CCAnomalyStatus"
        - name: severity
          in: query
          schema:
            $ref: "#/components/schemas/CCSeverity"
        - name: rule
          in: query
          description: anomaly_rules code, e.g. OUT_OF_TERRITORY
          schema: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        - name: party_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: One page of anomalies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CCAnomalyPage"
        "401": *ccUnauthorized
        "403": *ccForbidden
        "422": *ccInvalid
  /api/v1/cc/anomalies/{id}:
    patch:
      operationId: updateCommandCenterAnomaly
      summary: Follow up an anomaly (OPEN→ACK, OPEN/ACK→RESOLVED/FALSE_POSITIVE)
      description: Conditional update, recorded in audit_logs. note is required for RESOLVED and FALSE_POSITIVE.
      tags: [commandcenter]
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CCAnomalyUpdateRequest"
            examples:
              ack:
                summary: Acknowledge
                value:
                  status: ACK
                  note: Sedang dicek tim lapangan
              falsePositive:
                summary: Close as a false positive
                value:
                  status: FALSE_POSITIVE
                  note: Konsumen sedang mudik ke Makassar
              resolved:
                summary: Close as resolved
                value:
                  status: RESOLVED
                  note: Listing marketplace sudah diturunkan
      responses:
        "200":
          description: Anomaly after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CCAnomalyItem"
        "400":
          description: invalid_request (body is not valid JSON or has unknown fields)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401": *ccUnauthorized
        "403": *ccForbidden
        "404":
          description: anomaly_not_found (missing or outside scope)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: invalid_transition (not allowed from the current status)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422": *ccInvalid
  /api/v1/cc/conflicts:
    get:
      operationId: listCommandCenterConflicts
      summary: Allocation conflicts (offline POS vs online reservation), newest first
      tags: [commandcenter]
      security: [{ sessionCookie: [] }]
      parameters:
        - *ccLimit
        - *ccCursor
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, AUTO_RESOLVED, RESOLVED] }
        - name: kind
          in: query
          schema: { type: string, enum: [OFFLINE_SALE_PREEMPT, SERIAL_DOUBLE_SALE, STOCK_DISCREPANCY] }
        - *ccLocationId
      responses:
        "200":
          description: One page of conflicts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CCConflictPage"
        "401": *ccUnauthorized
        "403": *ccForbidden
        "422": *ccInvalid
  /api/v1/cc/distribution-leakage:
    get:
      operationId: listCommandCenterDistributionLeakage
      summary: Territory leakage index per distributor (Case 1)
      description: >
        Unit scans (consumer verification, claims, test buys) are attributed to the custodian
        at scan time (the last unit_event with a party before the scan, falling back to the
        current custodian), only while that party's DISTRIBUTOR role is active, then judged
        against the official territory in effect at scan time (NATIONAL is never out of
        territory). Scans whose region is coarser than the official territory (scan 35,
        territory 35.78) are not judged (unjudged_scans). Sample threshold and baseline come
        from anomaly_rules OUT_OF_TERRITORY. The ratio is rounded to 4 decimals once;
        above_baseline uses the displayed ratio. Alert when the ratio is above baseline with
        enough samples, or when there is an out-of-territory TEST_BUY hit.
      tags: [commandcenter]
      security: [{ sessionCookie: [] }]
      parameters:
        - *ccLimit
        - *ccCursor
        - name: days
          in: query
          description: >
            Time window in days. Capped at 90 because the index is computed synchronously per
            request; in production the computation moves to a worker or a daily materialized view.
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
        - name: party_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: One page of distributors, alerts and highest ratios first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CCLeakageResponse"
        "401": *ccUnauthorized
        "403": *ccForbidden
        "422": *ccInvalid
  # ==== [/commandcenter] ====

components:
  securitySchemes:
    sessionCookie:
      description: "Staff session. Set by POST /api/v1/auth/login; the browser sends it automatically on this page."
      type: apiKey
      in: cookie
      name: __Host-session
    consumerCookie:
      description: "Consumer session. Set by POST /api/v1/public/otp/verify (mock code 246810)."
      type: apiKey
      in: cookie
      name: __Host-consumer
    deviceToken:
      description: "POS device token. Demo device at TKO-JKS: demo-pos-21fcd6fed7cc10e338d71d9bc04d2548f96d21a5eb09f4f7760fcd72d0c57e29"
      type: http
      scheme: bearer
  schemas:
    # ==== [iam] schema di bawah ini ====
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          format: password
          maxLength: 1024
    LocationRef:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    MeUser:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
    MeRole:
      type: object
      required: [code, name, scope_mode, locations]
      properties:
        code:
          type: string
          description: Role code, e.g. ADMIN, CASHIER
        name:
          type: string
        scope_mode:
          $ref: "#/components/schemas/ScopeMode"
        locations:
          type: array
          description: Only filled for SELECTED scope
          items:
            $ref: "#/components/schemas/LocationRef"
    ScopeMode:
      type: string
      enum: [ALL, SELECTED]
    MeScope:
      type: object
      description: >
        Effective location scope. ALL = every location (locations is empty).
        SELECTED = only the listed locations; an empty list means no location
        access.
      required: [mode, locations]
      properties:
        mode:
          $ref: "#/components/schemas/ScopeMode"
        locations:
          type: array
          items:
            $ref: "#/components/schemas/LocationRef"
    MeResponse:
      type: object
      required: [user, roles, permissions, scope]
      properties:
        user:
          $ref: "#/components/schemas/MeUser"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/MeRole"
        permissions:
          type: array
          description: Union of permissions across all roles, sorted
          items:
            type: string
        scope:
          $ref: "#/components/schemas/MeScope"
    OtpRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          type: string
          maxLength: 32
          description: Indonesian mobile number, e.g. 0812xxxxxxxx or +62812xxxxxxxx
    OtpRequestResponse:
      type: object
      required: [expires_at, expires_in_seconds]
      properties:
        expires_at:
          type: string
          format: date-time
        expires_in_seconds:
          type: integer
    OtpVerifyRequest:
      type: object
      additionalProperties: false
      required: [phone, code]
      properties:
        phone:
          type: string
          maxLength: 32
        code:
          type: string
          pattern: "^[0-9]{6}$"
    ConsumerMeResponse:
      type: object
      required: [id, phone_masked]
      properties:
        id:
          type: string
          format: uuid
        phone_masked:
          type: string
          description: Masked E.164 number, e.g. +62812*****890
    # ==== [/iam] ====

    # ==== [serialization] ====
    SerialCodeList:
      type: array
      minItems: 1
      description: 16-character Crockford Base32 serial code; duplicates (after normalization) are rejected with 422
      items:
        type: string
        maxLength: 64
    MintCodesRequest:
      type: object
      additionalProperties: false
      required: [level_code, qty, printer_vendor]
      properties:
        level_code:
          type: string
          maxLength: 32
          description: packaging_levels code (UNIT, INNER, CARTON, PALLET)
        qty:
          type: integer
          minimum: 1
          maximum: 5000
        product_id:
          type: string
          format: uuid
        printer_vendor:
          type: string
          maxLength: 200
        notes:
          type: string
          maxLength: 1000
    CodeBatch:
      type: object
      required: [id, level_code, product_id, qty, printer_vendor, notes, issued_at]
      properties:
        id:
          type: string
          format: uuid
        level_code:
          type: string
        product_id:
          type: [string, "null"]
          format: uuid
        qty:
          type: integer
        printer_vendor:
          type: string
        notes:
          type: [string, "null"]
        issued_at:
          type: string
          format: date-time
    MintedCode:
      type: object
      required: [code]
      properties:
        code:
          type: string
        pin:
          type: string
          description: Claim PIN (UNIT level only); sent only once, in the mint response
    MintCodesResponse:
      type: object
      required: [code_batch, codes]
      properties:
        code_batch:
          $ref: "#/components/schemas/CodeBatch"
        codes:
          type: array
          items:
            $ref: "#/components/schemas/MintedCode"
    CommissionRequest:
      type: object
      additionalProperties: false
      required: [batch_id, codes]
      properties:
        batch_id:
          type: string
          format: uuid
        codes:
          allOf:
            - $ref: "#/components/schemas/SerialCodeList"
          maxItems: 5000
    CommissionResponse:
      type: object
      required: [batch_id, product_id, commissioned]
      properties:
        batch_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        commissioned:
          type: integer
    ReceiveSerialsRequest:
      type: object
      additionalProperties: false
      required: [location_id, codes]
      properties:
        location_id:
          type: string
          format: uuid
        codes:
          allOf:
            - $ref: "#/components/schemas/SerialCodeList"
          maxItems: 5000
    ReceiveSerialsResponse:
      type: object
      required: [location_id, roots, serials]
      properties:
        location_id:
          type: string
          format: uuid
        roots:
          type: integer
        serials:
          type: integer
          format: int64
    AggregateRequest:
      type: object
      additionalProperties: false
      required: [parent_code, child_codes]
      properties:
        parent_code:
          type: string
          maxLength: 64
        child_codes:
          allOf:
            - $ref: "#/components/schemas/SerialCodeList"
          maxItems: 1000
    AggregateResponse:
      type: object
      required: [parent_code, added, already_in_parent, child_count, capacity]
      properties:
        parent_code:
          type: string
        added:
          type: integer
        already_in_parent:
          type: integer
        child_count:
          type: integer
          format: int64
        capacity:
          type: integer
    UnpackResponse:
      type: object
      required: [code, unpacked]
      properties:
        code:
          type: string
        unpacked:
          type: integer
          format: int64
    RecallRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 1000
    RecallResponse:
      type: object
      required: [batch_id, status, recalled_at, quarantined, already_recalled]
      properties:
        batch_id:
          type: string
          format: uuid
        status:
          type: string
          const: RECALLED
        recalled_at:
          type: string
          format: date-time
        quarantined:
          type: integer
          format: int64
        already_recalled:
          type: boolean
    SerialShipmentCreateRequest:
      type: object
      additionalProperties: false
      required: [from_location_id, to_location_id, codes]
      properties:
        from_location_id:
          type: string
          format: uuid
        to_location_id:
          type: string
          format: uuid
        to_party_id:
          type: string
          format: uuid
          description: Defaults to the party that owns the destination location
        program_code:
          type: string
          minLength: 1
          maxLength: 64
          description: Price program, e.g. SUBSIDI_SULSEL_Q4
        codes:
          allOf:
            - $ref: "#/components/schemas/SerialCodeList"
          maxItems: 500
    SerialShipmentItem:
      type: object
      required: [serial_unit_id, product_id, qty]
      properties:
        serial_unit_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        qty:
          type: integer
    SerialShipmentResponse:
      type: object
      required: [id, code, status, from_location_id, to_location_id, to_party_id, program_code,
                 shipped_at, received_at, items, units, serials, skipped, already_received]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        status:
          type: string
          enum: [DRAFT, SHIPPED, RECEIVED, CANCELLED]
        from_location_id:
          type: string
          format: uuid
        to_location_id:
          type: string
          format: uuid
        to_party_id:
          type: [string, "null"]
          format: uuid
        program_code:
          type: [string, "null"]
        shipped_at:
          type: [string, "null"]
          format: date-time
        received_at:
          type: [string, "null"]
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/SerialShipmentItem"
        units:
          type: integer
          format: int64
        serials:
          type: integer
          format: int64
          description: Serials (all levels) whose status changed in this request
        skipped:
          type: integer
          format: int64
        already_received:
          type: boolean
    TraceRef:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: [string, "null"]
          format: uuid
        code:
          type: [string, "null"]
        name:
          type: [string, "null"]
    TraceLot:
      type: object
      required: [id, lot_no, status, exp_date]
      properties:
        id:
          type: string
          format: uuid
        lot_no:
          type: [string, "null"]
        status:
          type: [string, "null"]
        exp_date:
          type: [string, "null"]
          format: date-time
    TraceSerial:
      type: object
      required: [id, code, level_code, status, parent_id, product, batch, location, custodian,
                 commissioned_at, verify_count, first_verified_at, first_verified_city]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        level_code:
          type: string
        status:
          type: string
        parent_id:
          type: [string, "null"]
          format: uuid
        product:
          oneOf:
            - $ref: "#/components/schemas/TraceRef"
            - type: "null"
        batch:
          oneOf:
            - $ref: "#/components/schemas/TraceLot"
            - type: "null"
        location:
          oneOf:
            - $ref: "#/components/schemas/TraceRef"
            - type: "null"
        custodian:
          oneOf:
            - $ref: "#/components/schemas/TraceRef"
            - type: "null"
        commissioned_at:
          type: [string, "null"]
          format: date-time
        verify_count:
          type: integer
        first_verified_at:
          type: [string, "null"]
          format: date-time
        first_verified_city:
          type: [string, "null"]
    TraceAncestor:
      type: object
      required: [id, code, level_code, status, depth]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        level_code:
          type: string
        status:
          type: string
        depth:
          type: integer
          description: 1 = direct parent
    TraceDescendant:
      type: object
      required: [level_code, status, count]
      properties:
        level_code:
          type: string
        status:
          type: string
        count:
          type: integer
          format: int64
    TraceEvent:
      type: object
      required: [id, biz_step, from_status, to_status, parent_code, location_code, party_name,
                 actor_type, ref_type, ref_id, occurred_at]
      properties:
        id:
          type: string
          format: uuid
        biz_step:
          type: string
        from_status:
          type: [string, "null"]
        to_status:
          type: [string, "null"]
        parent_code:
          type: [string, "null"]
        location_code:
          type: [string, "null"]
        party_name:
          type: [string, "null"]
        actor_type:
          type: string
          enum: [USER, DEVICE, SYSTEM, CONSUMER]
        ref_type:
          type: [string, "null"]
        ref_id:
          type: [string, "null"]
          format: uuid
        occurred_at:
          type: string
          format: date-time
    TraceShipment:
      type: object
      required: [id, code, status, program_code, from_location_code, to_location_code, to_party_name,
                 via_code, shipped_at, received_at]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        status:
          type: string
        program_code:
          type: [string, "null"]
        from_location_code:
          type: string
        to_location_code:
          type: string
        to_party_name:
          type: [string, "null"]
        via_code:
          type: string
          description: Serial code (unit, carton, or pallet) recorded in shipment_items
        shipped_at:
          type: [string, "null"]
          format: date-time
        received_at:
          type: [string, "null"]
          format: date-time
    TraceScan:
      type: object
      required: [id, context, result, geo_source, region_code, region_name, rule_hits, occurred_at]
      properties:
        id:
          type: string
          format: uuid
        context:
          type: string
        result:
          $ref: "#/components/schemas/VerifyResult"
        geo_source:
          type: string
          enum: [GPS, IP, NONE]
        region_code:
          type: [string, "null"]
        region_name:
          type: [string, "null"]
        rule_hits:
          type: array
          items:
            type: string
        occurred_at:
          type: string
          format: date-time
    TraceResponse:
      type: object
      required: [serial, ancestors, descendants, events, shipments, scans]
      properties:
        serial:
          $ref: "#/components/schemas/TraceSerial"
        ancestors:
          type: array
          items:
            $ref: "#/components/schemas/TraceAncestor"
        descendants:
          type: array
          items:
            $ref: "#/components/schemas/TraceDescendant"
        events:
          type: array
          items:
            $ref: "#/components/schemas/TraceEvent"
        shipments:
          type: array
          items:
            $ref: "#/components/schemas/TraceShipment"
        scans:
          type: array
          items:
            $ref: "#/components/schemas/TraceScan"
    VerifyResult:
      type: string
      enum: [GENUINE_FIRST, GENUINE_REPEAT, SUSPICIOUS, NOT_FOUND, RECALLED]
    PublicVerifyRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          maxLength: 512
        lat:
          type: number
          minimum: -90
          maximum: 90
          description: Must be sent together with lng
        lng:
          type: number
          minimum: -180
          maximum: 180
        accuracy_m:
          type: integer
          minimum: 0
          maximum: 100000
    PublicVerifyResponse:
      type: object
      required: [result]
      properties:
        result:
          $ref: "#/components/schemas/VerifyResult"
        product:
          type: object
          description: Only for GENUINE_* and RECALLED
          required: [name, lot_no, exp_date]
          properties:
            name:
              type: [string, "null"]
            lot_no:
              type: [string, "null"]
            exp_date:
              type: [string, "null"]
              format: date-time
        first_verified_at:
          type: string
          format: date-time
        first_verified_city:
          type: string
    LoyaltyClaimRequest:
      type: object
      additionalProperties: false
      required: [code, pin]
      properties:
        code:
          type: string
          maxLength: 64
        pin:
          type: string
          maxLength: 64
          description: 10-character PIN inside the package
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        accuracy_m:
          type: integer
          minimum: 0
          maximum: 100000
    LoyaltyClaimStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, REVERSED]
    LoyaltyClaimResponse:
      type: object
      required: [claim_id, status, points, available_at, replayed]
      properties:
        claim_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/LoyaltyClaimStatus"
        points:
          type: integer
          format: int64
        available_at:
          type: string
          format: date-time
        replayed:
          type: boolean
    LoyaltyBalanceResponse:
      type: object
      required: [available, pending]
      properties:
        available:
          type: integer
          format: int64
        pending:
          type: integer
          format: int64
    ReviewClaimRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT, REVERSE]
          description: APPROVE/REJECT for PENDING claims; REVERSE (clawback) for APPROVED claims
        note:
          type: string
          maxLength: 1000
          description: Reason; required for REVERSE
    ReviewClaimResponse:
      type: object
      required: [claim_id, status, points, risk_score, risk_reasons, review_required, available_at, decided_at]
      properties:
        claim_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/LoyaltyClaimStatus"
        points:
          type: integer
          format: int64
        risk_score:
          type: integer
          minimum: 0
          maximum: 100
        risk_reasons:
          type: array
          items:
            type: object
            required: [rule, weight]
            properties:
              rule:
                type: string
              weight:
                type: integer
        review_required:
          type: boolean
        available_at:
          type: string
          format: date-time
        decided_at:
          type: [string, "null"]
          format: date-time
    # ==== [/serialization] ====

    # ==== [inventory] ====
    InventoryBalanceItem:
      type: object
      required: [location_id, location_code, location_name, location_type, sync_state, product_id, sku, product_name,
        physical_qty, reserved_qty, quarantine_qty, available_qty, online_buffer_qty, online_atp, updated_at]
      properties:
        location_id: { type: string, format: uuid }
        location_code: { type: string }
        location_name: { type: string }
        location_type: { type: string, description: "CENTRAL_WH, HUB, OWN_STORE, ..." }
        sync_state: { type: string, enum: [NOT_TRACKED, ONLINE, OFFLINE] }
        product_id: { type: string, format: uuid }
        sku: { type: string }
        product_name: { type: string }
        physical_qty: { type: integer, format: int64 }
        reserved_qty: { type: integer, format: int64 }
        quarantine_qty: { type: integer, format: int64 }
        available_qty: { type: integer, format: int64, description: physical − reserved − quarantine }
        online_buffer_qty: { type: integer, format: int64 }
        online_atp: { type: integer, format: int64, description: "Stock that may be promised online (0 when OFFLINE)" }
        updated_at: { type: string, format: date-time }
    InventoryBalancePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InventoryBalanceItem" }
        next_cursor:
          type: [string, "null"]
          description: null = last page
    InventoryAdjustmentRequest:
      type: object
      additionalProperties: false
      required: [location_id, product_id, qty_delta, reason]
      properties:
        location_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        qty_delta: { type: integer, format: int64, minimum: -1000000, maximum: 1000000, description: "≠ 0; negative = decrease" }
        reason: { type: string, minLength: 3, maxLength: 500, description: "Required, 3-500 characters (unicode)" }
    InventoryQuarantineRequest:
      type: object
      additionalProperties: false
      required: [location_id, product_id, qty, direction, reason]
      properties:
        location_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        qty: { type: integer, format: int64, minimum: 1, maximum: 1000000 }
        direction: { type: string, enum: [IN, OUT] }
        reason: { type: string, minLength: 3, maxLength: 500 }
    InventoryMovement:
      type: object
      required: [id, location_id, product_id, movement_type, physical_delta, reserved_delta, quarantine_delta,
        ref_type, ref_id, reason, actor_type, actor_id, occurred_at, recorded_at]
      properties:
        id: { type: string, format: uuid }
        location_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        movement_type: { type: string }
        physical_delta: { type: integer, format: int64 }
        reserved_delta: { type: integer, format: int64 }
        quarantine_delta: { type: integer, format: int64 }
        ref_type: { type: string }
        ref_id: { type: string, format: uuid }
        reason: { type: [string, "null"] }
        actor_type: { type: string, enum: [USER, DEVICE, SYSTEM, CONSUMER] }
        actor_id: { type: [string, "null"], format: uuid }
        occurred_at: { type: string, format: date-time }
        recorded_at: { type: string, format: date-time }
    InventoryBalance:
      type: object
      required: [location_id, product_id, physical_qty, reserved_qty, quarantine_qty, available_qty, updated_at]
      properties:
        location_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        physical_qty: { type: integer, format: int64 }
        reserved_qty: { type: integer, format: int64 }
        quarantine_qty: { type: integer, format: int64 }
        available_qty: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }
    InventoryStockChangeResponse:
      type: object
      required: [movement, balance, duplicate]
      properties:
        movement: { $ref: "#/components/schemas/InventoryMovement" }
        balance: { $ref: "#/components/schemas/InventoryBalance" }
        duplicate: { type: boolean, description: "true = Idempotency-Key replay, no new movement" }
    OrderStatus:
      type: string
      enum: [PENDING_PAYMENT, PAID, FULFILLING, SHIPPED, DELIVERED, COMPLETED, EXPIRED, NEEDS_ACTION, CANCELLED, RETURNED]
    OrderCreateLine:
      type: object
      additionalProperties: false
      required: [product_id, qty]
      properties:
        product_id: { type: string, format: uuid }
        qty: { type: integer, format: int64, minimum: 1, maximum: 1000 }
    OrderCreateRequest:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        channel_code: { type: string, maxLength: 32, description: "Empty = D2C_WEB; D2C channels only" }
        lines:
          type: array
          minItems: 1
          maxItems: 50
          description: Each product may appear only once
          items: { $ref: "#/components/schemas/OrderCreateLine" }
        note: { type: string, maxLength: 500 }
    OrderCancelRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    OrderFulfillLineSerials:
      type: object
      additionalProperties: false
      required: [order_line_id, serial_unit_ids]
      properties:
        order_line_id: { type: string, format: uuid }
        serial_unit_ids:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string, format: uuid }
    OrderFulfillRequest:
      type: object
      additionalProperties: false
      properties:
        serials:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/OrderFulfillLineSerials" }
    OrderLine:
      type: object
      required: [id, product_id, sku, product_name, qty, unit_price, discount, serial_unit_ids]
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        sku: { type: string }
        product_name: { type: string }
        qty: { type: integer, format: int64 }
        unit_price: { type: integer, format: int64, description: Whole rupiah }
        discount: { type: integer, format: int64 }
        serial_unit_ids:
          type: array
          items: { type: string, format: uuid }
    OrderReservation:
      type: object
      required: [id, order_line_id, location_id, product_id, qty, status, expires_at, created_at, closed_at, close_reason]
      properties:
        id: { type: string, format: uuid }
        order_line_id: { type: string, format: uuid }
        location_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        qty: { type: integer, format: int64 }
        status: { type: string, enum: [ACTIVE, COMMITTED, RELEASED, EXPIRED, PREEMPTED] }
        expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        closed_at: { type: [string, "null"], format: date-time }
        close_reason: { type: [string, "null"] }
    OrderHistoryEntry:
      type: object
      required: [from_status, to_status, reason, actor_type, at]
      properties:
        from_status:
          oneOf:
            - $ref: "#/components/schemas/OrderStatus"
            - type: "null"
        to_status: { $ref: "#/components/schemas/OrderStatus" }
        reason: { type: [string, "null"] }
        actor_type: { type: string, enum: [USER, DEVICE, SYSTEM, CONSUMER] }
        at: { type: string, format: date-time }
    OrderPayment:
      type: object
      required: [id, provider, provider_ref, amount, currency, status, received_at]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        provider_ref: { type: string }
        amount: { type: integer, format: int64 }
        currency: { type: string }
        status: { type: string, enum: [PENDING, SUCCEEDED, FAILED, REFUNDED] }
        received_at: { type: string, format: date-time }
    Order:
      type: object
      required: [id, channel_code, external_ref, status, currency, subtotal, discount, total, placed_at, paid_at,
        payment_expires_at, fulfillment_location_id, metadata, lines, reservations, history, payments]
      properties:
        id: { type: string, format: uuid }
        channel_code: { type: string }
        external_ref: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/OrderStatus" }
        currency: { type: string }
        subtotal: { type: integer, format: int64 }
        discount: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        placed_at: { type: string, format: date-time }
        paid_at: { type: [string, "null"], format: date-time }
        payment_expires_at: { type: [string, "null"], format: date-time }
        fulfillment_location_id: { type: [string, "null"], format: uuid }
        metadata:
          type: object
          additionalProperties: true
          description: >
            Operational notes and flags, e.g. note, refund_required,
            refund_reason, refund_payment_ids, needs_action_reason,
            expired_reason, split_fulfillment, payload_hash (marketplace import).
        lines:
          type: array
          items: { $ref: "#/components/schemas/OrderLine" }
        reservations:
          type: array
          items: { $ref: "#/components/schemas/OrderReservation" }
        history:
          type: array
          items: { $ref: "#/components/schemas/OrderHistoryEntry" }
        payments:
          type: array
          items: { $ref: "#/components/schemas/OrderPayment" }
    PaymentWebhookRequest:
      type: object
      additionalProperties: false
      required: [provider_ref, order_id, amount, currency, status]
      properties:
        provider_ref: { type: string, maxLength: 128, description: "Event or transaction ID at the provider; idempotency key" }
        order_id: { type: string, format: uuid }
        amount: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        status: { type: string, enum: [SUCCEEDED, FAILED] }
        method: { type: string, maxLength: 32 }
    PaymentWebhookResponse:
      type: object
      required: [payment_id, order_id, order_status, outcome, duplicate]
      properties:
        payment_id: { type: [string, "null"], format: uuid }
        order_id: { type: string, format: uuid }
        order_status: { $ref: "#/components/schemas/OrderStatus" }
        outcome:
          type: string
          enum: [PAID, LATE_PAYMENT_REALLOCATED, LATE_PAYMENT_NEEDS_ACTION, PAYMENT_FAILED, REFUND_REQUIRED, ALREADY_PROCESSED]
        duplicate: { type: boolean }
    MarketplaceOrderLine:
      type: object
      additionalProperties: false
      required: [sku, qty]
      properties:
        sku: { type: string, maxLength: 64 }
        qty: { type: integer, format: int64, minimum: 1, maximum: 1000 }
        unit_price: { type: integer, format: int64, minimum: 0, maximum: 1000000000000 }
        discount: { type: integer, format: int64, minimum: 0, description: "≤ qty × unit_price" }
    MarketplaceOrderRequest:
      type: object
      additionalProperties: false
      required: [channel_code, external_ref, lines]
      properties:
        channel_code: { type: string, maxLength: 32, description: "MARKETPLACE channel (SHOPEE, TOKOPEDIA, TIKTOK_SHOP)" }
        external_ref: { type: string, maxLength: 128 }
        placed_at: { type: string, format: date-time }
        currency: { type: string, minLength: 3, maxLength: 3, default: IDR }
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/MarketplaceOrderLine" }
    MarketplaceImportResponse:
      type: object
      required: [duplicate, order]
      properties:
        duplicate: { type: boolean }
        order: { $ref: "#/components/schemas/Order" }
    # ==== [/inventory] ====

    # ==== [pos] ====
    PosDeviceCreateRequest:
      type: object
      additionalProperties: false
      required: [location_id, name]
      properties:
        location_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100, description: "1-100 characters (unicode), no control characters" }
    PosDeviceRevokeRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 500 }
    PosDevice:
      type: object
      required: [id, location_id, location_code, location_name, name, status, last_seen_at, last_acked_seq,
        provisioned_by, revoked_at, created_at]
      properties:
        id: { type: string, format: uuid }
        location_id: { type: string, format: uuid }
        location_code: { type: string }
        location_name: { type: string }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, REVOKED] }
        last_seen_at: { type: [string, "null"], format: date-time }
        last_acked_seq: { type: integer, format: int64 }
        provisioned_by: { type: [string, "null"], format: uuid }
        revoked_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    PosDeviceProvisioned:
      type: object
      required: [device, token, signing_key]
      properties:
        device: { $ref: "#/components/schemas/PosDevice" }
        token: { type: string, description: "Device bearer token (prefix pos_). Shown only once." }
        signing_key:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: "HMAC-SHA256 key for transactions (32 bytes, lowercase hex). Shown only once."
    PosDevicePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PosDevice" }
        next_cursor: { type: [string, "null"], description: null = last page }
    PosBootstrap:
      type: object
      required: [server_time, device, location, limits, products, price_list, stock, cashiers, serials]
      properties:
        server_time: { type: string, format: date-time }
        device: { $ref: "#/components/schemas/PosDevice" }
        location:
          type: object
          required: [id, code, name, timezone, sync_state]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            name: { type: string }
            timezone: { type: string }
            sync_state: { type: string, enum: [NOT_TRACKED, ONLINE, OFFLINE] }
        limits:
          type: object
          required: [offline_limit_seconds, heartbeat_interval_seconds, heartbeat_timeout_seconds,
            clock_skew_tolerance_seconds, sync_max_batch, sync_max_body_bytes, max_serials_per_txn,
            high_discount_percent, offline_value_limit]
          properties:
            offline_limit_seconds: { type: integer, format: int64 }
            heartbeat_interval_seconds: { type: integer, format: int64 }
            heartbeat_timeout_seconds: { type: integer, format: int64 }
            clock_skew_tolerance_seconds: { type: integer, format: int64 }
            sync_max_batch: { type: integer }
            sync_max_body_bytes: { type: integer, format: int64 }
            max_serials_per_txn: { type: integer, description: "Serial limit per transaction (in addition to <= qty per line)" }
            high_discount_percent: { type: integer, description: "A line discount above this → flag HIGH_DISCOUNT" }
            offline_value_limit: { type: integer, format: int64, description: "A total above this → flag OFFLINE_VALUE_LIMIT" }
        products:
          type: array
          items:
            type: object
            required: [id, sku, gtin, name, uom]
            properties:
              id: { type: string, format: uuid }
              sku: { type: string }
              gtin: { type: [string, "null"] }
              name: { type: string }
              uom: { type: string }
        price_list:
          description: >
            The POS price list currently in effect (a location-specific list
            fully replaces the default list). null when there is none.
          oneOf:
            - type: "null"
            - type: object
              required: [id, code, version, location_id, currency, valid_from, valid_to, items]
              properties:
                id: { type: string, format: uuid }
                code: { type: string }
                version: { type: integer, format: int64, description: "Sent as price_list_version in transactions" }
                location_id: { type: [string, "null"], format: uuid }
                currency: { type: string }
                valid_from: { type: string, format: date-time }
                valid_to: { type: [string, "null"], format: date-time }
                items:
                  type: array
                  items:
                    type: object
                    required: [product_id, price]
                    properties:
                      product_id: { type: string, format: uuid }
                      price: { type: integer, format: int64 }
        stock:
          type: array
          items:
            type: object
            required: [product_id, physical_qty, reserved_qty, quarantine_qty, available_qty]
            properties:
              product_id: { type: string, format: uuid }
              physical_qty: { type: integer, format: int64 }
              reserved_qty: { type: integer, format: int64 }
              quarantine_qty: { type: integer, format: int64 }
              available_qty: { type: integer, format: int64 }
        cashiers:
          type: array
          items:
            type: object
            required: [id, name, pos_pin_hash]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              pos_pin_hash: { type: string, description: "argon2id PHC string, for local PIN verification" }
        serials: { $ref: "#/components/schemas/PosSerialPage" }
    PosSerialPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            type: object
            required: [code, product_id]
            properties:
              code: { type: string }
              product_id: { type: string, format: uuid }
        next_cursor: { type: [string, "null"] }
    PosHeartbeatRequest:
      type: object
      additionalProperties: false
      properties:
        client_time: { type: string, format: date-time, description: "Device clock; used to compute clock_skew_ms" }
        pending_count:
          type: integer
          format: int64
          minimum: 0
          description: >
            Number of un-acked transactions in the outbox. Must be 0 (with no
            seq gap on the server) for the store to become ONLINE; omitted =
            unknown (the store does not become ONLINE).
    PosHeartbeatResponse:
      type: object
      required: [server_time, location_sync_state, last_acked_seq, heartbeat_interval_seconds, heartbeat_timeout_seconds,
        clock_skew_ms, online_blocked_reason]
      properties:
        server_time: { type: string, format: date-time }
        location_sync_state: { type: string, enum: [NOT_TRACKED, ONLINE, OFFLINE] }
        last_acked_seq: { type: integer, format: int64 }
        heartbeat_interval_seconds: { type: integer, format: int64 }
        heartbeat_timeout_seconds: { type: integer, format: int64 }
        clock_skew_ms: { type: [integer, "null"], format: int64, description: "server_time − client_time" }
        online_blocked_reason:
          type: [string, "null"]
          enum: [pending_count_missing, pending_outbox, missing_seqs, null]
          description: "null = this heartbeat made the store ONLINE"
    PosTransaction:
      type: object
      description: >
        One cashier transaction (created offline). Total = Σ(qty × unit_price −
        discount); payments >= total (change only from CASH; non-cash must not
        exceed the total); free text without control characters (\n and \t are
        allowed in note). Unknown fields make the transaction REJECTED
        invalid_payload (they are still signed).
      required: [client_txn_id, device_seq, cashier_id, occurred_at, price_list_version, total, lines, payments, signature]
      properties:
        client_txn_id: { type: string, format: uuid }
        device_seq: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
        cashier_id: { type: string, format: uuid, description: "Active user with pos.sync scope at the device's location" }
        occurred_at: { type: string, format: date-time, description: "Device clock at transaction time" }
        price_list_version: { type: integer, format: int64, minimum: 1 }
        total: { type: integer, format: int64, minimum: 0 }
        note: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [product_id, qty, unit_price, discount]
            properties:
              product_id: { type: string, format: uuid }
              qty: { type: integer, format: int64, minimum: 1, maximum: 1000 }
              unit_price: { type: integer, format: int64, minimum: 0, maximum: 100000000000 }
              discount: { type: integer, format: int64, minimum: 0, description: "<= qty × unit_price" }
              serials:
                type: array
                description: >
                  Scanned UNIT serial codes (<= qty per line, total <=
                  max_serials_per_txn, unique per transaction after
                  normalization). Malformed codes are still accepted with flag
                  SERIAL_INVALID_FORMAT.
                items: { type: string, minLength: 1, maxLength: 64 }
        payments:
          type: array
          maxItems: 10
          items:
            type: object
            required: [method, amount]
            properties:
              method: { type: string, enum: [CASH, EDC, QRIS], description: "At most one CASH" }
              amount: { type: integer, format: int64, minimum: 1, maximum: 100000000000000 }
              approval_ref:
                type: string
                maxLength: 64
                description: "Required for EDC/QRIS (deduplicated per (provider, provider_ref)); not used for CASH"
        signature: { type: string, pattern: "^[0-9a-fA-F]{64}$", description: "hex HMAC-SHA256(signing_key, canonical)" }
    PosSyncRequest:
      type: object
      additionalProperties: false
      required: [transactions]
      properties:
        client_time: { type: string, format: date-time, description: "Device clock when the batch is sent (for clock_skew_ms)" }
        transactions:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/PosTransaction" }
    PosSyncConflict:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [OFFLINE_SALE_PREEMPT, STOCK_DISCREPANCY, SERIAL_DOUBLE_SALE, SERIAL_UNREGISTERED, PAYMENT_REF_DUPLICATE]
        conflict_id: { type: string, format: uuid, description: "allocation_conflicts.id (first three kinds)" }
        product_id: { type: string, format: uuid }
        qty: { type: integer, format: int64 }
        order_id: { type: string, format: uuid, description: "Online order whose reservation was preempted" }
        reservation_id: { type: string, format: uuid }
        code: { type: string, description: "Serial code" }
        reason:
          type: string
          description: >
            SERIAL_DOUBLE_SALE: already_sold, wrong_location, not_sellable_status, not_unit,
            product_mismatch, sell_failed. SERIAL_UNREGISTERED: not_registered.
            PAYMENT_REF_DUPLICATE: approval_ref_reused.
        method: { type: string }
        approval_ref: { type: string }
        anomaly_rule: { type: string }
    PosSyncDetail:
      type: object
      description: >
        The stored result_detail, replayed as is. For RETRY and for REJECTED
        results that are not stored (invalid_signature, broken identity,
        device_seq_reused) only reason, message, and errors. message and
        errors[].message are Indonesian, cashier-facing text.
      properties:
        server_txn_id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        reason: { type: string }
        message: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
        received_at: { type: string, format: date-time }
        occurred_at: { type: string, format: date-time, description: "Skew-corrected time used by the ledger" }
        clock_skew_ms: { type: integer, format: int64 }
        flags:
          type: array
          items:
            type: string
            enum: [CASHIER_INACTIVE, CLOCK_SKEW, FUTURE_TIMESTAMP, HIGH_DISCOUNT, OFFLINE_TOO_LONG, OFFLINE_VALUE_LIMIT,
              PRICE_MISMATCH, PRICE_STALE, SERIAL_INVALID_FORMAT, ZERO_TOTAL]
        invalid_serials:
          type: array
          description: Scanned codes that are not in serial format (as sent)
          items: { type: string }
        conflicts:
          type: array
          items: { $ref: "#/components/schemas/PosSyncConflict" }
        serials_sold:
          type: array
          items: { type: string }
        totals:
          type: object
          required: [subtotal, discount, total, paid, change_due]
          properties:
            subtotal: { type: integer, format: int64 }
            discount: { type: integer, format: int64 }
            total: { type: integer, format: int64 }
            paid: { type: integer, format: int64 }
            change_due: { type: integer, format: int64 }
    PosSyncResult:
      type: object
      required: [index, client_txn_id, device_seq, status, result, detail]
      properties:
        index: { type: integer, description: "Position of the transaction in the request (results are ordered by device_seq)" }
        client_txn_id: { type: string, format: uuid, description: "Nil UUID when the item's identity cannot be read" }
        device_seq: { type: integer, format: int64 }
        status: { type: string, enum: [ACCEPTED, ACCEPTED_WITH_CONFLICT, REJECTED, DUPLICATE, RETRY] }
        result:
          type: string
          enum: [ACCEPTED, ACCEPTED_WITH_CONFLICT, REJECTED, ""]
          description: "Stored result (for DUPLICATE = the original result); empty for RETRY"
        detail: { $ref: "#/components/schemas/PosSyncDetail" }
    PosSyncResponse:
      type: object
      required: [server_time, ack_up_to_seq, missing_seqs, missing_seqs_truncated, results]
      properties:
        server_time: { type: string, format: date-time }
        ack_up_to_seq: { type: integer, format: int64 }
        missing_seqs:
          type: array
          items: { type: integer, format: int64 }
        missing_seqs_truncated: { type: boolean }
        results:
          type: array
          items: { $ref: "#/components/schemas/PosSyncResult" }
    ConflictResolveRequest:
      type: object
      additionalProperties: false
      required: [resolution, note]
      properties:
        resolution:
          type: string
          enum: [CUSTOMER_COMPENSATED, ORDER_CANCELLED, STOCK_RECOUNTED, SERIAL_RECORD_CORRECTED, FALSE_ALARM, OTHER]
        note: { type: string, minLength: 3, maxLength: 1000, description: "Required; no control characters other than \\n and \\t" }
    # ==== [/pos] ====

    # ==== [commandcenter] ====
    CCRunoutLevel:
      type: string
      enum: [CRITICAL, WARNING, INSUFFICIENT_DATA, OK]
    CCAnomalyStatus:
      type: string
      enum: [OPEN, ACK, RESOLVED, FALSE_POSITIVE]
    CCSeverity:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    CCSummaryResponse:
      type: object
      required: [generated_at, runout, stock, anomalies, conflicts, stores]
      properties:
        generated_at: { type: string, format: date-time }
        runout:
          type: object
          required: [window_days, critical_items, critical_locations, warning_items, warning_locations, insufficient_data_items, earliest_runout_date]
          properties:
            window_days: { type: integer }
            critical_items: { type: integer, format: int64 }
            critical_locations: { type: integer, format: int64 }
            warning_items: { type: integer, format: int64 }
            warning_locations: { type: integer, format: int64 }
            insufficient_data_items: { type: integer, format: int64 }
            earliest_runout_date:
              type: [string, "null"]
              format: date
              description: Earliest stock-out date among CRITICAL/WARNING items (location time zone)
        stock:
          type: object
          required: [out_of_stock_items, out_of_stock_locations]
          properties:
            out_of_stock_items: { type: integer, format: int64, description: "Own SKU-location pairs with available 0" }
            out_of_stock_locations: { type: integer, format: int64 }
        anomalies:
          type: object
          required: [open_total, open_by_severity, top_party]
          properties:
            open_total: { type: integer, format: int64 }
            open_by_severity:
              type: object
              required: [LOW, MEDIUM, HIGH, CRITICAL]
              properties:
                LOW: { type: integer, format: int64 }
                MEDIUM: { type: integer, format: int64 }
                HIGH: { type: integer, format: int64 }
                CRITICAL: { type: integer, format: int64 }
            top_party:
              description: Party with the most OPEN anomalies
              oneOf:
                - $ref: "#/components/schemas/CCPartyCount"
                - type: "null"
        conflicts:
          type: object
          required: [open_total]
          properties:
            open_total: { type: integer, format: int64 }
        stores:
          type: object
          required: [total, offline]
          properties:
            total: { type: integer, format: int64 }
            offline: { type: integer, format: int64, description: "Stores with sync_state OFFLINE" }
    CCPartyCount:
      type: object
      required: [party_id, party_name, open_count]
      properties:
        party_id: { type: string, format: uuid }
        party_name: { type: string }
        open_count: { type: integer, format: int64 }
    CCStockItem:
      type: object
      required: [location_id, location_code, location_name, location_type, sync_state, last_heartbeat_at, product_id, sku, product_name,
                 physical_qty, reserved_qty, quarantine_qty, available_qty, is_estimate, updated_at]
      properties:
        location_id: { type: string, format: uuid }
        location_code: { type: string }
        location_name: { type: string }
        location_type: { type: string }
        sync_state: { type: string, enum: [NOT_TRACKED, ONLINE, OFFLINE] }
        last_heartbeat_at: { type: [string, "null"], format: date-time }
        product_id: { type: string, format: uuid }
        sku: { type: string }
        product_name: { type: string }
        physical_qty: { type: integer, format: int64 }
        reserved_qty: { type: integer, format: int64 }
        quarantine_qty: { type: integer, format: int64 }
        available_qty: { type: integer, format: int64 }
        is_estimate:
          type: boolean
          description: true for locations that are not owned; the figure is an estimate from recorded sell-in
        updated_at: { type: string, format: date-time }
    CCStockPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CCStockItem" }
        next_cursor: { type: [string, "null"] }
    CCRunoutItem:
      type: object
      required: [location_id, location_code, location_name, location_type, product_id, sku, product_name, available_qty, is_estimate,
                 sold_qty, history_days, avg_daily_sales, days_of_inventory, runout_date, level, reasons, has_policy, min_qty,
                 lead_time_days, safety_days]
      properties:
        location_id: { type: string, format: uuid }
        location_code: { type: string }
        location_name: { type: string }
        location_type: { type: string }
        product_id: { type: string, format: uuid }
        sku: { type: string }
        product_name: { type: string }
        available_qty: { type: integer, format: int64 }
        is_estimate: { type: boolean }
        sold_qty: { type: integer, format: int64, description: "Units sold in the 28-day window" }
        history_days:
          type: [integer, "null"]
          minimum: 1
          maximum: 28
          description: Average divisor = days since the first movement for (location, product); null without sales
        avg_daily_sales: { type: [number, "null"], description: "null without sales history" }
        days_of_inventory: { type: [number, "null"], description: "null without sales history" }
        runout_date: { type: [string, "null"], format: date, description: "Today (location time zone) + DOI; null when DOI is null or > 3650" }
        level: { $ref: "#/components/schemas/CCRunoutLevel" }
        reasons:
          type: array
          items:
            type: string
            enum: [STOCK_OUT, BELOW_LEAD_TIME, BELOW_SAFETY_DAYS, BELOW_MIN_QTY, NO_SALES_HISTORY, SHORT_HISTORY, NO_POLICY]
        has_policy: { type: boolean, description: "false = no stock_policies; only the stock-out rule applies" }
        min_qty: { type: [integer, "null"], format: int64 }
        lead_time_days: { type: [integer, "null"] }
        safety_days: { type: [integer, "null"] }
    CCRunoutResponse:
      type: object
      required: [items, next_cursor, window_days, generated_at]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CCRunoutItem" }
        next_cursor: { type: [string, "null"] }
        window_days: { type: integer }
        generated_at: { type: string, format: date-time }
    CCAnomalyItem:
      type: object
      required: [id, rule_code, rule_name, severity, status, subject_type, subject_id, party_id, party_name, region_code, region_name,
                 hit_count, evidence, first_seen_at, last_seen_at, resolved_by, resolved_at, resolution_note, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        rule_code: { type: string }
        rule_name: { type: string }
        severity: { $ref: "#/components/schemas/CCSeverity" }
        status: { $ref: "#/components/schemas/CCAnomalyStatus" }
        subject_type: { type: string }
        subject_id: { type: [string, "null"], format: uuid }
        party_id: { type: [string, "null"], format: uuid }
        party_name: { type: [string, "null"] }
        region_code: { type: [string, "null"] }
        region_name: { type: [string, "null"] }
        hit_count: { type: integer }
        evidence: { type: object, additionalProperties: true }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        resolved_by: { type: [string, "null"], format: uuid }
        resolved_at: { type: [string, "null"], format: date-time }
        resolution_note: { type: [string, "null"] }
        version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CCAnomalyPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CCAnomalyItem" }
        next_cursor: { type: [string, "null"] }
    CCAnomalyUpdateRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ACK, RESOLVED, FALSE_POSITIVE] }
        note:
          type: [string, "null"]
          maxLength: 1000
          description: >
            Required for RESOLVED and FALSE_POSITIVE (stored as resolution_note and in the
            audit log). Optional for ACK, where it is only recorded in audit_logs.reason, not on
            the anomaly. Leading and trailing spaces are trimmed. Control characters (NUL, ESC,
            CR, DEL, C1) are rejected with 422 invalid_characters; newline and tab are allowed.
    CCConflictItem:
      type: object
      required: [id, kind, status, location_id, location_code, location_name, product_id, sku, product_name, qty, pos_transaction_id,
                 reservation_id, order_id, serial_unit_id, resolution, details, resolved_by, resolved_at, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [OFFLINE_SALE_PREEMPT, SERIAL_DOUBLE_SALE, STOCK_DISCREPANCY] }
        status: { type: string, enum: [OPEN, AUTO_RESOLVED, RESOLVED] }
        location_id: { type: string, format: uuid }
        location_code: { type: string }
        location_name: { type: string }
        product_id: { type: string, format: uuid }
        sku: { type: string }
        product_name: { type: string }
        qty: { type: [integer, "null"], format: int64 }
        pos_transaction_id: { type: [string, "null"], format: uuid }
        reservation_id: { type: [string, "null"], format: uuid }
        order_id: { type: [string, "null"], format: uuid }
        serial_unit_id: { type: [string, "null"], format: uuid }
        resolution: { type: [string, "null"] }
        details: { type: object, additionalProperties: true }
        resolved_by: { type: [string, "null"], format: uuid }
        resolved_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    CCConflictPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CCConflictItem" }
        next_cursor: { type: [string, "null"] }
    CCLeakageItem:
      type: object
      required: [party_id, party_name, coverage_mode, total_scans, located_scans, unlocated_scans, judged_scans, unjudged_scans,
                 out_of_territory_scans, leak_ratio,
                 sample_too_small, test_buy_scans, test_buy_hits, above_baseline, alert]
      properties:
        party_id: { type: string, format: uuid }
        party_name: { type: string }
        coverage_mode:
          type: [string, "null"]
          enum: [NATIONAL, SELECTED, null]
          description: null = the distributor has no official territory in effect (ratio not computed)
        total_scans: { type: integer, format: int64 }
        located_scans: { type: integer, format: int64 }
        unlocated_scans: { type: integer, format: int64 }
        judged_scans: { type: integer, format: int64, description: "Scans that can be judged in or out of territory (ratio base)" }
        unjudged_scans:
          type: integer
          format: int64
          description: Scans with a region that cannot be judged (scan region coarser than the official territory, or no official territory at scan time)
        out_of_territory_scans: { type: [integer, "null"], format: int64 }
        leak_ratio: { type: [number, "null"], description: "Out of territory ÷ judged scans, 4 decimals" }
        sample_too_small: { type: boolean }
        test_buy_scans: { type: integer, format: int64 }
        test_buy_hits: { type: integer, format: int64, description: "Out-of-territory TEST_BUY scans (strong signal)" }
        above_baseline: { type: boolean }
        alert: { type: boolean }
    CCLeakageResponse:
      type: object
      required: [items, next_cursor, window_days, from, to, min_scans, baseline_ratio]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CCLeakageItem" }
        next_cursor: { type: [string, "null"] }
        window_days: { type: integer }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        min_scans: { type: integer, format: int64 }
        baseline_ratio: { type: number }
    # ==== [/commandcenter] ====

    LiveResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadyResponse:
      type: object
      required: [status, schema_version, checked_at]
      properties:
        status:
          type: string
          const: ready
        schema_version:
          type: integer
          format: int64
        checked_at:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable code; never changes with the wording
        detail:
          type: string
        request_id:
          type: string
        errors:
          type: array
          description: Filled for 422 validation_failed
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: JSON path, e.g. lines[0].qty
        code:
          type: string
        message:
          type: string
