      summary: Review a points claim (APPROVE/REJECT for PENDING, REVERSE for APPROVED)
      description: >
        REJECT and REVERSE (clawback, note required) reverse the points through
        an idempotent REVERSE ledger entry, free the unit for the real buyer,
        and return the serial to its previous status (SOLD or AT_PARTNER).
        Resending the same decision is idempotent; a different decision on an
        already decided claim returns 409 claim_already_decided.
      security: [{ sessionCookie: [] }]
