openapi: 3.1.0
info:
  title: mGanik API
  version: 0.1.0
  description: >
    Kontrak API backend mGanik. Sumber tunggal untuk tipe frontend
    (openapi-typescript). Error memakai application/problem+json (RFC 9457).
paths:
  /healthz:
    get:
      operationId: getLive
      summary: Liveness, menjawab selama proses hidup
      responses:
        "200":
          description: Proses hidup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveResponse"
  /readyz:
    get:
      operationId: getReady
      summary: Readiness, database terhubung dan migrasi sudah diterapkan
      responses:
        "200":
          description: Siap menerima request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Belum siap
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  # ==== [iam] path di bawah ini ====
  # Request ber-cookie dengan metode POST/PUT/PATCH/DELETE wajib
  # Content-Type: application/json dan Origin (bila ada) sama dengan host atau
  # terdaftar di ALLOWED_ORIGINS (403 csrf_rejected / 415 unsupported_media_type).
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Login staff dengan email + password
      description: >
        Sukses memasang cookie `__Host-session` (HttpOnly, Secure, SameSite=Lax,
        idle 8 jam, absolut 12 jam) dan mengembalikan profil seperti /auth/me.
        Gagal memakai pesan generik yang sama untuk email tidak dikenal maupun
        password salah. Percobaan dibatasi per email (5) dan per IP (20) dalam
        15 menit; jatah dipesan sebelum password diverifikasi, jadi request
        paralel tidak bisa melewatinya. Login sukses tidak memakan jatah IP.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login berhasil
          headers:
            Set-Cookie:
              description: "__Host-session=<token>; Path=/; Max-Age=43200; HttpOnly; Secure; SameSite=Lax"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "400":
          description: Lihat field code (problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: invalid_credentials (email atau password salah)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: account_disabled, atau csrf_rejected
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: Lihat field code (problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Lihat field code (problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: too_many_attempts; detail memuat menit tunggu
          headers:
            Retry-After:
              description: Detik sampai boleh mencoba lagi
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: server_busy (verifikasi password bersamaan penuh); coba lagi
          headers:
            Retry-After:
              description: Detik sampai boleh mencoba lagi
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Mencabut sesi staff dan menghapus cookie
      description: Idempotent; selalu 204 walau sesi sudah kedaluwarsa atau tidak ada.
      tags: [auth]
      security:
        - sessionCookie: []
        - {}
      responses:
        "204":
          description: Sesi dicabut (kalau ada) dan cookie dihapus
        "403":
          description: Lihat field code (problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: Lihat field code (problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/me:
    get:
      operationId: getMe
      summary: Profil staff yang sedang login, role, permission, dan scope lokasi
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Profil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: unauthenticated atau session_expired
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Pemanggil bukan staff (mis. token device)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/public/otp/request:
    post:
      operationId: requestConsumerOtp
      summary: Minta kode OTP login konsumen (mock)
      description: >
        Nomor dinormalkan ke E.164 Indonesia (+628...). Prototype memakai kode
        OTP tetap (OTP_MOCK_CODE) yang tidak pernah dikembalikan di respons;
        dimatikan (503 otp_unavailable) di production tanpa izin demo. Dibatasi
        5 permintaan per nomor dan 20 per IP dalam 15 menit.
      tags: [consumer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "202":
          description: Kode dikirim (respons sama untuk nomor baru maupun lama)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResponse"
        "403":
          description: Lihat field code (problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: Lihat field code (problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Lihat field code (problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: too_many_attempts; detail memuat menit tunggu
          headers:
            Retry-After:
              description: Detik sampai boleh mencoba lagi
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Lihat field code (problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/public/otp/verify:
    post:
      operationId: verifyConsumerOtp
      summary: Verifikasi OTP dan buat sesi konsumen
      description: >
        Sukses memasang cookie `__Host-consumer` (idle 24 jam, absolut 7 hari).
        Maksimal 5 percobaan per kode; setelah itu minta kode baru. Cookie
        konsumen lama (bila ada) dicabut dan diganti.
      tags: [consumer]
      security:
        - consumerCookie: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
      responses:
        "200":
          description: Login konsumen berhasil
          headers:
            Set-Cookie:
              description: "__Host-consumer=<token>; Path=/; Max-Age=604800; HttpOnly; Secure; SameSite=Lax"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerMeResponse"
        "401":
          description: otp_invalid (kode salah atau kedaluwarsa)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: consumer_blocked atau csrf_rejected
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: Lihat field code (problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Lihat field code (problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: too_many_attempts; detail memuat menit tunggu
          headers:
            Retry-After:
              description: Detik sampai boleh mencoba lagi
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Lihat field code (problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/public/consumer/me:
    get:
      operationId: getConsumerMe
      summary: Konsumen yang sedang login (nomor disamarkan)
      description: Butuh cookie `__Host-consumer` dari /public/otp/verify.
      tags: [consumer]
      security:
        - consumerCookie: []
      responses:
        "200":
          description: Profil konsumen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerMeResponse"
        "401":
          description: Lihat field code (problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/public/consumer/logout:
    post:
      operationId: logoutConsumer
      summary: Mencabut sesi konsumen dan menghapus cookie
      description: Idempotent; memakai cookie `__Host-consumer` bila ada.
      tags: [consumer]
      security:
        - consumerCookie: []
        - {}
      responses:
        "204":
          description: Sesi dicabut (kalau ada) dan cookie dihapus
        "403":
          description: Lihat field code (problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: Lihat field code (problem+json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  # ==== [/iam] ====

  # ==== [serialization] produksi, agregasi, shipment, verifikasi, klaim ====
  /api/v1/code-batches:
    post:
      operationId: mintCodes
      summary: Mint kode serial acak 80-bit (dan PIN klaim untuk UNIT) untuk satu job cetak
      description: >
        Permission code.mint. Kode dan PIN plaintext hanya dikembalikan sekali di
        respons ini sebagai bahan file cetak; DB hanya menyimpan HMAC PIN.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MintCodesRequest"
      responses:
        "201":
          description: Job cetak dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintCodesResponse"
        # Anchor YAML dipakai ulang semua respons error di bagian ini
        # (components.responses berada di luar marker bagian ini).
        "400": &serialProblem
          description: Error domain (application/problem+json, kode di field code)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401": *serialProblem
        "403": *serialProblem
        "422": *serialProblem
  /api/v1/serials/commission:
    post:
      operationId: commissionSerials
      summary: Ikat label GENERATED ke batch produksi (→ COMMISSIONED)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommissionRequest"
      responses:
        "200":
          description: Label di-commission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionResponse"
        "401": *serialProblem
        "403": *serialProblem
        "404": *serialProblem
        "409": *serialProblem
        "422": *serialProblem
  /api/v1/serials/receive:
    post:
      operationId: receiveSerials
      summary: Terima hasil produksi (COMMISSIONED → IN_STOCK) ke lokasi sendiri, beserta turunannya
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiveSerialsRequest"
      responses:
        "200":
          description: Serial diterima
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiveSerialsResponse"
        "401": *serialProblem
        "403": *serialProblem
        "404": *serialProblem
        "409": *serialProblem
        "422": *serialProblem
  /api/v1/serials/aggregate:
    post:
      operationId: aggregateSerials
      summary: Masukkan unit ke karton atau karton ke palet
      description: >
        Validasi rank level, spesifikasi kemasan, kapasitas, produk, aturan
        campuran batch, anak belum punya induk, tanpa siklus. Anak yang sudah
        ada di induk yang sama dilewati (aman di-retry).
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AggregateRequest"
      responses:
        "200":
          description: Agregasi berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AggregateResponse"
        "401": *serialProblem
        "403": *serialProblem
        "404": *serialProblem
        "409": *serialProblem
        "422": *serialProblem
  /api/v1/serials/{code}/unpack:
    post:
      operationId: unpackSerial
      summary: Bongkar kemasan (keluarkan semua anak langsung)
      security: [{ sessionCookie: [] }]
      parameters:
        - &serialCodeParam
          name: code
          in: path
          required: true
          description: Kode serial 16 karakter Crockford Base32 (huruf kecil/tanda hubung dinormalkan)
          schema:
            type: string
      responses:
        "200":
          description: Kemasan dibongkar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnpackResponse"
        "401": *serialProblem
        "403": *serialProblem
        "404": *serialProblem
        "409": *serialProblem
  /api/v1/serials/{code}/trace:
    get:
      operationId: traceSerial
      summary: Genealogi serial (leluhur, turunan, event, shipment, custodian, scan)
      description: >
        Shipment diambil dari riwayat event (unit dan karton/palet yang pernah
        membungkusnya), jadi tetap terlihat setelah kemasan dibongkar.
      security: [{ sessionCookie: [] }]
      parameters:
        - *serialCodeParam
      responses:
        "200":
          description: Genealogi serial
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceResponse"
        "401": *serialProblem
        "403": *serialProblem
        "404": *serialProblem
  /api/v1/batches/{id}/recall:
    post:
      operationId: recallBatch
      summary: Recall batch; unit di rantai pasok → QUARANTINED massal (idempotent)
      security: [{ sessionCookie: [] }]
      parameters:
        - &serialIdParam
          name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecallRequest"
      responses:
        "200":
          description: Batch di-recall
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallResponse"
        "401": *serialProblem
        "403": *serialProblem
        "404": *serialProblem
        "422": *serialProblem
  /api/v1/shipments:
    post:
      operationId: createSerialShipment
      summary: Kirim palet/karton/unit; status dan custodian seluruh turunan berpindah dalam satu statement
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SerialShipmentCreateRequest"
      responses:
        "201":
          description: Shipment dikirim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SerialShipmentResponse"
        "401": *serialProblem
        "403": *serialProblem
        "404": *serialProblem
        "409": *serialProblem
        "422": *serialProblem
  /api/v1/shipments/{id}/receive:
    post:
      operationId: receiveSerialShipment
      summary: Terima shipment (→ AT_PARTNER di lokasi mitra, IN_STOCK di lokasi sendiri; idempotent)
      security: [{ sessionCookie: [] }]
      parameters:
        - *serialIdParam
      responses:
        "200":
          description: Shipment diterima (atau sudah diterima sebelumnya)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SerialShipmentResponse"
        "401": *serialProblem
        "403": *serialProblem
        "404": *serialProblem
        "409": *serialProblem
  /api/v1/loyalty/claims/{id}/review:
    post:
      operationId: reviewLoyaltyClaim
      summary: Review klaim poin (APPROVE/REJECT untuk PENDING, REVERSE untuk APPROVED)
      description: >
        REJECT dan REVERSE (clawback, note wajib) membalik poin lewat ledger
        REVERSE yang idempotent, membebaskan unit untuk pembeli asli, dan
        mengembalikan serial ke status asalnya (SOLD/AT_PARTNER). Keputusan sama
        yang dikirim ulang idempotent; keputusan lain untuk klaim yang sudah
        diputuskan 409 claim_already_decided.
      security: [{ sessionCookie: [] }]
      parameters:
        - *serialIdParam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewClaimRequest"
      responses:
        "200":
          description: Keputusan tersimpan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewClaimResponse"
        "401": *serialProblem
        "403": *serialProblem
        "404": *serialProblem
        "409": *serialProblem
        "422": *serialProblem
  /api/v1/public/verify:
    post:
      operationId: verifySerial
      summary: Verifikasi keaslian produk (publik, tanpa login)
      description: >
        Rate limit per IP (IPv4 per alamat, IPv6 per /64; 429 + Retry-After).
        Server memasang cookie anonim mg_vid untuk fingerprint scan. Respons
        tidak memuat status internal serial; kode berformat salah langsung
        NOT_FOUND (tetap direkam untuk hotspot pemalsuan).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicVerifyRequest"
      responses:
        "200":
          description: Hasil verifikasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicVerifyResponse"
        "400": *serialProblem
        "422": *serialProblem
        "429": *serialProblem
  /api/v1/public/claims:
    post:
      operationId: claimLoyaltyPoints
      summary: Klaim poin dengan PIN di dalam kemasan (sesi konsumen)
      description: >
        423 claim_locked setelah 5 PIN salah per unit; 409 already_claimed atau
        claim_not_allowed (unit belum terjual); 403 claim_previously_rejected
        kalau klaim akun ini untuk unit itu pernah ditolak/dibalik; 422
        duplicate_code tidak berlaku (satu kode). Rate limit per IP dan per
        akun (429). Klaim ulang oleh akun yang sama mengembalikan klaim lama
        dengan status 200 (replayed=true).
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoyaltyClaimRequest"
      responses:
        "200":
          description: Klaim yang sama dikirim ulang
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoyaltyClaimResponse"
        "201":
          description: Klaim tercatat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoyaltyClaimResponse"
        "401": *serialProblem
        "403": *serialProblem
        "409": *serialProblem
        "422": *serialProblem
        "423": *serialProblem
        "429": *serialProblem
  /api/v1/public/loyalty/balance:
    get:
      operationId: getLoyaltyBalance
      summary: Saldo poin konsumen (tersedia vs masih tertahan masa tunggu/review)
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Saldo poin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoyaltyBalanceResponse"
        "401": *serialProblem
        "403": *serialProblem
  # ==== [/serialization] ====

  # ==== [inventory] stok, order, pembayaran ====
  # Route staff butuh sesi + permission; lokasi di luar scope principal = 403.
  # POST pembuat data memakai header Idempotency-Key (1-255 karakter ASCII).
  # Teks bebas (reason, note, external_ref, sku, provider_ref, ...) dengan
  # karakter kontrol selain \n dan \t ditolak 422 invalid_characters.
  # Webhook pembayaran & impor marketplace tanpa sesi, ditandatangani HMAC:
  #   X-Mganik-Timestamp: <unix detik>  (toleransi ±5 menit)
  #   X-Mganik-Signature: v1=<hex HMAC-SHA256(WEBHOOK_SECRET, timestamp + "." + body)>
  /api/v1/inventory/balances:
    get:
      operationId: listInventoryBalances
      summary: Saldo stok per (lokasi, produk) dengan ATP online
      description: >
        Pagination keyset (location_id, product_id) lewat cursor opaque.
        Principal ber-scope SELECTED hanya melihat lokasinya. online_atp =
        available − online_buffer_qty, dan 0 kalau POS lokasi OFFLINE.
        Permission inventory.read.
      tags: [inventory]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: location_id, in: query, schema: { type: string, format: uuid } }
        - { name: product_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
      responses:
        "200":
          description: Satu halaman saldo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryBalancePage" }
        # Anchor YAML dipakai ulang di seluruh bagian [inventory] (marker hanya
        # mengizinkan path & schema, bukan components.responses/parameters).
        "401": &invProblem
          description: Error domain (problem+json, lihat field code)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403": *invProblem
        "422": *invProblem
  /api/v1/inventory/adjustments:
    post:
      operationId: createInventoryAdjustment
      summary: Stock opname (ADJUST_COUNT ±) dengan alasan wajib, diaudit
      description: >
        Idempotency-Key yang sama dengan isi sama = 200 duplicate (tanpa mutasi
        baru); isi berbeda = 422 idempotency_key_reused. Mengurangi melebihi
        available = 409 insufficient_stock. Permission inventory.adjust.
      tags: [inventory]
      security: [{ sessionCookie: [] }]
      parameters:
        - &invIdemKey
          name: Idempotency-Key
          in: header
          required: true
          description: Kunci idempotensi dari klien (1-255 karakter ASCII terlihat)
          schema: { type: string, minLength: 1, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryAdjustmentRequest" }
      responses:
        "201":
          description: Mutasi dicatat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryStockChangeResponse" }
        "200":
          description: Replay Idempotency-Key (duplicate=true)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryStockChangeResponse" }
        "400": *invProblem
        "401": *invProblem
        "403": *invProblem
        "409": *invProblem
        "422": *invProblem
  /api/v1/inventory/quarantine:
    post:
      operationId: moveInventoryQuarantine
      summary: Pindah stok ke karantina (IN) atau rilis (OUT), diaudit
      description: Permission inventory.quarantine. Semantik Idempotency-Key sama dengan adjustment.
      tags: [inventory]
      security: [{ sessionCookie: [] }]
      parameters:
        - *invIdemKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryQuarantineRequest" }
      responses:
        "201":
          description: Mutasi dicatat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryStockChangeResponse" }
        "200":
          description: Replay Idempotency-Key (duplicate=true)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryStockChangeResponse" }
        "400": *invProblem
        "401": *invProblem
        "403": *invProblem
        "409": *invProblem
        "422": *invProblem
  /api/v1/orders:
    post:
      operationId: createOrder
      summary: Buat order D2C dan pesan stok (PENDING_PAYMENT)
      description: >
        Harga dari price list channel. Seluruh line dipesan di SATU lokasi
        (gudang pusat dulu, lalu lokasi lain yang online_fulfillment_enabled),
        all-or-nothing, dengan batas bayar RESERVATION_TTL. Idempotency-Key
        wajib: replay = respons identik + header Idempotent-Replayed: true,
        isi berbeda = 422 idempotency_key_reused, masih diproses = 409
        idempotency_in_progress. Stok tidak cukup = 409 out_of_stock dengan
        errors[] per line (field lines[i].qty, code insufficient_stock atau
        not_at_single_location). Permission order.create.
      tags: [orders]
      security: [{ sessionCookie: [] }]
      parameters:
        - *invIdemKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderCreateRequest" }
      responses:
        "201":
          description: Order dibuat (atau replay)
          headers:
            Idempotent-Replayed:
              description: "true kalau respons adalah replay"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": *invProblem
        "401": *invProblem
        "403": *invProblem
        "409": *invProblem
        "422": *invProblem
  /api/v1/orders/{id}:
    get:
      operationId: getOrder
      summary: Order lengkap (line, reservasi, riwayat status, pembayaran)
      description: Permission order.read; principal SELECTED hanya order dari lokasinya.
      tags: [orders]
      security: [{ sessionCookie: [] }]
      parameters:
        - &invOrderID
          name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": *invProblem
        "403": *invProblem
        "404": *invProblem
  /api/v1/orders/{id}/cancel:
    post:
      operationId: cancelOrder
      summary: Batalkan order dan lepas reservasinya
      description: >
        Dari PENDING_PAYMENT, PAID, atau NEEDS_ACTION. Order yang sudah dibayar
        ditandai metadata.refund_required. Membatalkan order CANCELLED = 200
        apa adanya. Permission order.cancel.
      tags: [orders]
      security: [{ sessionCookie: [] }]
      parameters:
        - *invOrderID
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderCancelRequest" }
      responses:
        "200":
          description: Order sesudah dibatalkan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": *invProblem
        "403": *invProblem
        "404": *invProblem
        "409": *invProblem
        "422": *invProblem
  /api/v1/orders/{id}/fulfill:
    post:
      operationId: fulfillOrder
      summary: Penuhi order PAID (COMMIT_SALE, PAID → FULFILLING → SHIPPED)
      description: >
        Body opsional: serial unit per line dicatat di order_line_serials (satu
        unit hanya terjual sekali = 409 serial_already_sold). Order SHIPPED =
        200 apa adanya. Permission order.fulfill + semua lokasi reservasi di scope.
      tags: [orders]
      security: [{ sessionCookie: [] }]
      parameters:
        - *invOrderID
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderFulfillRequest" }
      responses:
        "200":
          description: Order sesudah dikirim
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": *invProblem
        "403": *invProblem
        "404": *invProblem
        "409": *invProblem
        "422": *invProblem
  /api/v1/webhooks/payments/mock:
    post:
      operationId: paymentWebhookMock
      summary: Webhook pembayaran mock (signature HMAC, idempotent per provider_ref)
      description: >
        Nominal dan mata uang harus sama dengan total order. PENDING_PAYMENT →
        PAID. Bayar telat (EXPIRED): stok dipesan ulang → PAID, atau
        NEEDS_ACTION + refund kalau stok habis. Kiriman ulang = 200
        ALREADY_PROCESSED.
      tags: [payments]
      security: []
      parameters:
        - &invWebhookTimestamp
          name: X-Mganik-Timestamp
          in: header
          required: true
          description: Unix detik; harus dalam ±5 menit dari jam server (401 stale_timestamp)
          schema: { type: string, pattern: "^[0-9]+$" }
        - &invWebhookSignature
          name: X-Mganik-Signature
          in: header
          required: true
          description: v1=<hex HMAC-SHA256(WEBHOOK_SECRET, timestamp + "." + body)> (401 invalid_signature)
          schema: { type: string, pattern: "^v1=[0-9a-f]{64}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentWebhookRequest" }
      responses:
        "200":
          description: Event diproses (atau duplikat)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentWebhookResponse" }
        "401": *invProblem
        "404": *invProblem
        "409": *invProblem
        "422": *invProblem
        "503": *invProblem
  /api/v1/channels/marketplace/orders:
    post:
      operationId: importMarketplaceOrder
      summary: Impor order marketplace yang sudah dibayar (signature HMAC)
      description: >
        Dedupe per (channel_code, external_ref): impor ulang dengan isi sama =
        200 duplicate dengan order yang sama; isi berbeda = 409
        external_ref_conflict. Order langsung PAID; stok tidak cukup → order
        tetap dibuat lalu NEEDS_ACTION (tidak ditolak).
      tags: [orders]
      security: []
      parameters:
        - *invWebhookTimestamp
        - *invWebhookSignature
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarketplaceOrderRequest" }
      responses:
        "201":
          description: Order baru
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketplaceImportResponse" }
        "200":
          description: Duplikat (order yang sudah ada)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketplaceImportResponse" }
        "401": *invProblem
        "409": *invProblem
        "422": *invProblem
        "503": *invProblem
  # ==== [/inventory] ====

  # ==== [pos] ====
  # ==== [/pos] ====

  # ==== [commandcenter] ====
  # Read model Supply Chain Command Center (Pilar D). Semua endpoint butuh
  # permission cc.read (PATCH anomali: anomaly.resolve) dan data difilter ke
  # lokasi dalam scope pemanggil. List memakai pagination keyset: kirim
  # next_cursor dari respons sebelumnya sebagai `cursor`. Semua timestamp
  # dikirim dalam UTC (akhiran Z).
  /api/v1/cc/summary:
    get:
      operationId: getCommandCenterSummary
      summary: Fakta ringkas untuk kalimat ringkasan Command Center
      description: >
        Hitungan runout dan stok habis hanya untuk lokasi milik sendiri; stok di lokasi
        mitra hanya estimasi dan tidak masuk ringkasan (tetap tampil di /cc/runout).
      tags: [commandcenter]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Angka terstruktur; UI yang menyusun kalimat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CCSummaryResponse"
        "401": &ccUnauthorized
          description: Belum masuk
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403": &ccForbidden
          description: Tanpa permission, atau filter lokasi di luar scope
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cc/stock:
    get:
      operationId: listCommandCenterStock
      summary: Saldo stok per lokasi dan produk (physical, reserved, quarantine, available)
      description: Stok di lokasi bukan milik sendiri (gudang mitra, marketplace) ditandai is_estimate.
      tags: [commandcenter]
      security: [{ sessionCookie: [] }]
      parameters:
        - &ccLimit
          name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - &ccCursor
          name: cursor
          in: query
          description: next_cursor dari halaman sebelumnya (opaque)
          schema: { type: string, maxLength: 1024 }
        - &ccLocationType
          name: location_type
          in: query
          description: Kode location_types, mis. CENTRAL_WH, HUB, OWN_STORE, PARTNER_WH
          schema: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        - &ccLocationId
          name: location_id
          in: query
          schema: { type: string, format: uuid }
        - &ccProductId
          name: product_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Satu halaman saldo, urut kode lokasi lalu SKU
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CCStockPage"
        "401": *ccUnauthorized
        "403": *ccForbidden
        "422": &ccInvalid
          description: Query param tidak valid (limit, cursor, filter)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cc/runout:
    get:
      operationId: listCommandCenterRunout
      summary: Days of inventory dan perkiraan tanggal habis per lokasi dan produk
      description: >
        DOI = available ÷ rata-rata penjualan harian (DIRECT_SALE + COMMIT_SALE dalam 28 hari
        terakhir ÷ history_days). history_days = hari sejak mutasi pertama (lokasi, produk),
        1..28, sehingga SKU baru tidak dibagi 28 hari; riwayat < 7 hari diberi reason
        SHORT_HISTORY. DOI dibulatkan 2 desimal sekali dan nilai itu yang dipakai untuk level.
        CRITICAL bila DOI < lead_time_days atau stok habis padahal masih laku; WARNING bila
        DOI < lead_time_days + safety_days atau available < min_qty; INSUFFICIENT_DATA bila
        tanpa riwayat penjualan (DOI null, tidak dikarang). Urut paling kritis dulu.
      tags: [commandcenter]
      security: [{ sessionCookie: [] }]
      parameters:
        - *ccLimit
        - *ccCursor
        - *ccLocationType
        - *ccLocationId
        - *ccProductId
        - name: level
          in: query
          schema:
            $ref: "#/components/schemas/CCRunoutLevel"
      responses:
        "200":
          description: Satu halaman runout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CCRunoutResponse"
        "401": *ccUnauthorized
        "403": *ccForbidden
        "422": *ccInvalid
  /api/v1/cc/anomalies:
    get:
      operationId: listCommandCenterAnomalies
      summary: Antrean anomali distribusi dan stok, terbaru dulu
      description: >
        Pemanggil ber-scope lokasi (SELECTED) hanya melihat anomali dengan subject_type
        LOCATION di lokasinya; anomali distribusi (party/wilayah) hanya untuk scope ALL.
      tags: [commandcenter]
      security: [{ sessionCookie: [] }]
      parameters:
        - *ccLimit
        - *ccCursor
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/CCAnomalyStatus"
        - name: severity
          in: query
          schema:
            $ref: "#/components/schemas/CCSeverity"
        - name: rule
          in: query
          description: Kode anomaly_rules, mis. OUT_OF_TERRITORY
          schema: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        - name: party_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Satu halaman anomali
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CCAnomalyPage"
        "401": *ccUnauthorized
        "403": *ccForbidden
        "422": *ccInvalid
  /api/v1/cc/anomalies/{id}:
    patch:
      operationId: updateCommandCenterAnomaly
      summary: Tindak lanjut anomali (OPEN→ACK, OPEN/ACK→RESOLVED/FALSE_POSITIVE)
      description: Perubahan bersyarat dan dicatat di audit_logs. note wajib untuk RESOLVED dan FALSE_POSITIVE.
      tags: [commandcenter]
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CCAnomalyUpdateRequest"
      responses:
        "200":
          description: Anomali setelah diubah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CCAnomalyItem"
        "400":
          description: Body bukan JSON valid atau memuat field tak dikenal
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401": *ccUnauthorized
        "403": *ccForbidden
        "404":
          description: Anomali tidak ada atau di luar scope (anomaly_not_found)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Transisi tidak sah dari status sekarang (invalid_transition)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422": *ccInvalid
  /api/v1/cc/conflicts:
    get:
      operationId: listCommandCenterConflicts
      summary: Konflik alokasi (POS offline vs reservasi online), terbaru dulu
      tags: [commandcenter]
      security: [{ sessionCookie: [] }]
      parameters:
        - *ccLimit
        - *ccCursor
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, AUTO_RESOLVED, RESOLVED] }
        - name: kind
          in: query
          schema: { type: string, enum: [OFFLINE_SALE_PREEMPT, SERIAL_DOUBLE_SALE, STOCK_DISCREPANCY] }
        - *ccLocationId
      responses:
        "200":
          description: Satu halaman konflik
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CCConflictPage"
        "401": *ccUnauthorized
        "403": *ccForbidden
        "422": *ccInvalid
  /api/v1/cc/distribution-leakage:
    get:
      operationId: listCommandCenterDistributionLeakage
      summary: Indeks kebocoran wilayah per distributor (Kasus 1)
      description: >
        Scan unit (verifikasi konsumen, klaim, test-buy) dikaitkan ke custodian SAAT scan
        (unit_events ber-party terakhir sebelum scan, fallback custodian sekarang), hanya
        selama role DISTRIBUTOR party itu aktif, lalu dinilai terhadap wilayah resmi yang
        berlaku saat scan (NATIONAL tidak pernah keluar wilayah). Scan yang wilayahnya lebih
        kasar dari wilayah resmi (scan 35, territory 35.78) tidak dinilai (unjudged_scans).
        Ambang sampel dan baseline dari anomaly_rules OUT_OF_TERRITORY. Rasio dibulatkan 4
        desimal sekali; above_baseline memakai rasio yang ditampilkan. Alert bila rasio di
        atas baseline dengan sampel cukup, atau ada hit TEST_BUY di luar wilayah.
      tags: [commandcenter]
      security: [{ sessionCookie: [] }]
      parameters:
        - *ccLimit
        - *ccCursor
        - name: days
          in: query
          description: >
            Jendela waktu dalam hari. Maksimal 90 karena indeks dihitung sinkron per request;
            di produksi perhitungan dipindah ke worker/materialized view harian.
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
        - name: party_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Satu halaman distributor, alert dan rasio tertinggi dulu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CCLeakageResponse"
        "401": *ccUnauthorized
        "403": *ccForbidden
        "422": *ccInvalid
  # ==== [/commandcenter] ====

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session
    consumerCookie:
      type: apiKey
      in: cookie
      name: __Host-consumer
    deviceToken:
      type: http
      scheme: bearer
  schemas:
    # ==== [iam] schema di bawah ini ====
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          format: password
          maxLength: 1024
    LocationRef:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    MeUser:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
    MeRole:
      type: object
      required: [code, name, scope_mode, locations]
      properties:
        code:
          type: string
          description: Kode role, mis. ADMIN, CASHIER
        name:
          type: string
        scope_mode:
          $ref: "#/components/schemas/ScopeMode"
        locations:
          type: array
          description: Hanya terisi untuk scope SELECTED
          items:
            $ref: "#/components/schemas/LocationRef"
    ScopeMode:
      type: string
      enum: [ALL, SELECTED]
    MeScope:
      type: object
      description: >
        Scope lokasi efektif. ALL = semua lokasi (locations kosong). SELECTED =
        hanya locations; daftar kosong berarti tidak ada akses lokasi.
      required: [mode, locations]
      properties:
        mode:
          $ref: "#/components/schemas/ScopeMode"
        locations:
          type: array
          items:
            $ref: "#/components/schemas/LocationRef"
    MeResponse:
      type: object
      required: [user, roles, permissions, scope]
      properties:
        user:
          $ref: "#/components/schemas/MeUser"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/MeRole"
        permissions:
          type: array
          description: Gabungan permission semua role, urut
          items:
            type: string
        scope:
          $ref: "#/components/schemas/MeScope"
    OtpRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          type: string
          maxLength: 32
          description: Nomor seluler Indonesia, mis. 0812xxxxxxxx atau +62812xxxxxxxx
    OtpRequestResponse:
      type: object
      required: [expires_at, expires_in_seconds]
      properties:
        expires_at:
          type: string
          format: date-time
        expires_in_seconds:
          type: integer
    OtpVerifyRequest:
      type: object
      additionalProperties: false
      required: [phone, code]
      properties:
        phone:
          type: string
          maxLength: 32
        code:
          type: string
          pattern: "^[0-9]{6}$"
    ConsumerMeResponse:
      type: object
      required: [id, phone_masked]
      properties:
        id:
          type: string
          format: uuid
        phone_masked:
          type: string
          description: Nomor E.164 yang disamarkan, mis. +62812*****890
    # ==== [/iam] ====

    # ==== [serialization] ====
    SerialCodeList:
      type: array
      minItems: 1
      description: Kode serial 16 karakter Crockford Base32; duplikat (setelah normalisasi) ditolak 422
      items:
        type: string
        maxLength: 64
    MintCodesRequest:
      type: object
      additionalProperties: false
      required: [level_code, qty, printer_vendor]
      properties:
        level_code:
          type: string
          maxLength: 32
          description: Kode packaging_levels (UNIT, INNER, CARTON, PALLET)
        qty:
          type: integer
          minimum: 1
          maximum: 5000
        product_id:
          type: string
          format: uuid
        printer_vendor:
          type: string
          maxLength: 200
        notes:
          type: string
          maxLength: 1000
    CodeBatch:
      type: object
      required: [id, level_code, product_id, qty, printer_vendor, notes, issued_at]
      properties:
        id:
          type: string
          format: uuid
        level_code:
          type: string
        product_id:
          type: [string, "null"]
          format: uuid
        qty:
          type: integer
        printer_vendor:
          type: string
        notes:
          type: [string, "null"]
        issued_at:
          type: string
          format: date-time
    MintedCode:
      type: object
      required: [code]
      properties:
        code:
          type: string
        pin:
          type: string
          description: PIN klaim (hanya level UNIT); hanya dikirim sekali di respons mint
    MintCodesResponse:
      type: object
      required: [code_batch, codes]
      properties:
        code_batch:
          $ref: "#/components/schemas/CodeBatch"
        codes:
          type: array
          items:
            $ref: "#/components/schemas/MintedCode"
    CommissionRequest:
      type: object
      additionalProperties: false
      required: [batch_id, codes]
      properties:
        batch_id:
          type: string
          format: uuid
        codes:
          allOf:
            - $ref: "#/components/schemas/SerialCodeList"
          maxItems: 5000
    CommissionResponse:
      type: object
      required: [batch_id, product_id, commissioned]
      properties:
        batch_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        commissioned:
          type: integer
    ReceiveSerialsRequest:
      type: object
      additionalProperties: false
      required: [location_id, codes]
      properties:
        location_id:
          type: string
          format: uuid
        codes:
          allOf:
            - $ref: "#/components/schemas/SerialCodeList"
          maxItems: 5000
    ReceiveSerialsResponse:
      type: object
      required: [location_id, roots, serials]
      properties:
        location_id:
          type: string
          format: uuid
        roots:
          type: integer
        serials:
          type: integer
          format: int64
    AggregateRequest:
      type: object
      additionalProperties: false
      required: [parent_code, child_codes]
      properties:
        parent_code:
          type: string
          maxLength: 64
        child_codes:
          allOf:
            - $ref: "#/components/schemas/SerialCodeList"
          maxItems: 1000
    AggregateResponse:
      type: object
      required: [parent_code, added, already_in_parent, child_count, capacity]
      properties:
        parent_code:
          type: string
        added:
          type: integer
        already_in_parent:
          type: integer
        child_count:
          type: integer
          format: int64
        capacity:
          type: integer
    UnpackResponse:
      type: object
      required: [code, unpacked]
      properties:
        code:
          type: string
        unpacked:
          type: integer
          format: int64
    RecallRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 1000
    RecallResponse:
      type: object
      required: [batch_id, status, recalled_at, quarantined, already_recalled]
      properties:
        batch_id:
          type: string
          format: uuid
        status:
          type: string
          const: RECALLED
        recalled_at:
          type: string
          format: date-time
        quarantined:
          type: integer
