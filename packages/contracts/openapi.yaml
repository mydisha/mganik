openapi: 3.1.0
info:
  title: mGanik API
  version: 0.1.0
  description: |
    mGanik backend API contract. Single source for the frontend types
    (openapi-typescript). Errors use application/problem+json (RFC 9457);
    `title`, `detail`, and `errors[].message` are user-facing Indonesian text,
    `code` is the stable machine-readable value.

    ## Trying the API from this page

    1. Start the stack with `docker compose up --build` (or `make up`) and open this
       page at `http://localhost:8088/api/docs/`. The page and the API share one
       origin, so session cookies and the CSRF Origin check work without extra setup.
       Use Chrome or Firefox: Safari rejects `Secure` cookies on plain
       `http://localhost`.
    2. **Staff endpoints:** run `POST /api/v1/auth/login` with a demo account below.
       The browser keeps the `__Host-session` cookie and sends it with later requests,
       so the Authorize button is not needed for cookie endpoints.
    3. **Consumer endpoints** (loyalty claims): `POST /api/v1/public/otp/request` with
       any Indonesian mobile number, then `POST /api/v1/public/otp/verify` with the
       mock code `246810`. This sets the `__Host-consumer` cookie.
    4. **POS device endpoints:** click **Authorize** and paste the demo device token
       below into `deviceToken`.
    5. **Serialization endpoints** (mint, commission, aggregate/unpack, shipments, recall)
       need production or warehouse permissions: log in as `admin@mganik.test` to try
       them all, or as `produksi@mganik.test` / `gudang@mganik.test` for the role-scoped view.

    Request bodies are prefilled with demo data; open the examples dropdown where an
    endpoint has several scenarios. All demo values are deterministic seed fixtures,
    not secrets. `make demo-data` prints every unit code and claim PIN.

    | Demo account | Role | Locations |
    |---|---|---|
    | `ops@mganik.test` | OPS_MANAGER | all |
    | `admin@mganik.test` | ADMIN | all |
    | `produksi@mganik.test` | PRODUCTION_OPERATOR | GDP-BKS |
    | `gudang@mganik.test` | WAREHOUSE_STAFF | GDP-BKS, HUB-SBY |
    | `kepala.jaksel@mganik.test` | STORE_MANAGER | TKO-JKS |
    | `kasir.jaksel@mganik.test` | CASHIER | TKO-JKS |
    | `marketing@mganik.test` | MARKETING_ANALYST | all |

    Password for every account: `mganik-demo-2026`. Cashier PIN in the `/pos` app: `135790`.

    | Demo data | Value |
    |---|---|
    | Product DEMO-HRB-SCH10 (serialized) | `1709c346-10d1-5585-9ef0-7005904214ab` |
    | Product DEMO-TEH-BAG20 | `37a8fc14-037a-5a0b-a220-3c212c909693` |
    | Location GDP-BKS (central warehouse) | `13792935-de43-5ce7-b15b-82c7a923b1fc` |
    | Location TKO-JKS (Jakarta Selatan store) | `1666259e-6aa4-5d50-b297-5fd2887e7719` |
    | Location TKO-BDG (Bandung store, no POS device yet) | `05dc2ae7-585d-5895-9dbf-2d8db39d6b97` |
    | Location MTR-JATIM (distributor warehouse, East Java territory) | `6f9f90ed-6526-5dda-9151-33f6c87a3448` |
    | Batch L2610A | `1893fd4a-6962-54f0-82b9-2b436728b537` |
    | Pallet / carton 1 / carton 4 (central warehouse) | `4WXENVZYGZVNBATA` / `F39RX076413BA6Q2` / `AWCKZ55T937HQSS8` |
    | Unit #1, still in the central warehouse | `MVTW3YW6H7GAJW8S` (claim PIN `6QVEQ8Q4G1`) |
    | Unit #49, last DEMO-HRB-SCH10 unit at TKO-JKS | `AT2JXMFN8BS93A4D` (claim PIN `WNPFPPNWP7`) |
    | POS device token (TKO-JKS) | `demo-pos-21fcd6fed7cc10e338d71d9bc04d2548f96d21a5eb09f4f7760fcd72d0c57e29` |

    A suggested walk through the three core flows:

    - **Serial verification and anti-fraud:** `POST /api/v1/public/verify` with each
      example; sell unit #49 in the `/pos` app, then claim its points with
      `POST /api/v1/public/claims`; a second claim from another account is rejected.
    - **Stock allocation with concurrency protection:** `POST /api/v1/orders`; replay
      the same `Idempotency-Key` for an identical response, and try the oversell example.
    - **Offline POS reconciliation:** sell in `/pos` with the network off, reconnect,
      then check `GET /api/v1/cc/conflicts` and `GET /api/v1/inventory/balances`.

    ## Signed endpoints

    These endpoints need an HMAC signature, so "Try it out" alone cannot call them:

    - `POST /api/v1/pos/sync` signs every transaction with the device signing key.
      The cashier app at `/pos` signs, stores offline, and syncs for you.
    - `POST /api/v1/webhooks/payments/mock` and `POST /api/v1/channels/marketplace/orders`
      are signed with `WEBHOOK_SECRET` (demo default below). From a shell:

    ```sh
    SECRET=demo-webhook-secret-ganti-sebelum-dipakai-sungguhan
    BODY='{"channel_code":"SHOPEE","external_ref":"SHP-DEMO-0001","currency":"IDR","lines":[{"sku":"DEMO-TEH-BAG20","qty":1,"unit_price":33000,"discount":0}]}'
    TS=$(date +%s)
    SIG=$(printf '%s.%s' "$TS" "$BODY" | openssl dgst -sha256 -hmac "$SECRET" -hex | awk '{print $NF}')
    curl -sS http://localhost:8088/api/v1/channels/marketplace/orders \
      -H 'Content-Type: application/json' \
      -H "X-Mganik-Timestamp: $TS" -H "X-Mganik-Signature: v1=$SIG" \
      -d "$BODY"
    ```

    For the payment webhook, use the same commands with
    `/api/v1/webhooks/payments/mock` and a body like the example on that endpoint
    (the `order_id` and `amount` of an order from `POST /api/v1/orders`).

    ## Postman

    Import `http://localhost:8088/api/docs/openapi.yaml` (or
    `packages/contracts/openapi.yaml`) with File → Import. For cookie endpoints, call
    the login endpoint first and send `Origin: http://localhost:8088` on
    POST/PUT/PATCH/DELETE. If Postman does not resend the `Secure` session cookie
    over plain http, use this page instead.
tags:
- name: health
  description: Liveness and readiness probes
- name: auth
  description: Staff login and session (cookie __Host-session)
- name: consumer
  description: Consumer login with a mock SMS OTP (cookie __Host-consumer)
- name: verification
  description: 'Pillar A: public authenticity check and the anti-counterfeit radar'
- name: loyalty
  description: 'Case 2: point claims with the in-pack PIN, balance, and staff review'
- name: serialization
  description: 'Pillar A: code minting, commissioning, aggregation, shipments, trace, recall'
- name: inventory
  description: 'Pillar B: stock balances, adjustments, and quarantine'
- name: orders
  description: 'Pillar B: omnichannel orders with oversell protection, marketplace import'
- name: payments
  description: Mock payment gateway webhook
- name: pos
  description: 'Pillar C: POS devices, bootstrap, heartbeat, and offline sync'
- name: commandcenter
  description: 'Pillar D: Supply Chain Command Center read model and work queues'

paths:
  /healthz:
    get:
      operationId: getLive
      tags: [health]
      summary: "Liveness: returns 200 while the API process is running"
      responses:
        "200":
          description: Process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveResponse"
  /readyz:
    get:
      operationId: getReady
      tags: [health]
      summary: "Readiness: database reachable and migrations applied"
      responses:
        "200":
          description: Ready to serve requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: database_unavailable or schema_not_ready
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  # ==== [iam] path di bawah ini ====
  # Request ber-cookie dengan metode POST/PUT/PATCH/DELETE wajib
  # Content-Type: application/json dan Origin (bila ada) sama dengan host atau
  # terdaftar di ALLOWED_ORIGINS (403 csrf_rejected / 415 unsupported_media_type).
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Staff login with email and password
      description: >
        On success, sets the `__Host-session` cookie (HttpOnly, Secure,
        SameSite=Lax, 8 h idle, 12 h absolute) and returns the same profile as
        /auth/me. Failures use one generic message for both an unknown email and
        a wrong password. Attempts are limited per email (5) and per IP (20)
        within 15 minutes; the quota is reserved before the password is
        verified, so parallel requests cannot bypass it. A successful login does
        not consume IP quota.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              ops:
                summary: Ops manager (all locations)
                value:
                  email: ops@mganik.test
                  password: mganik-demo-2026
              warehouse:
                summary: Warehouse staff (GDP-BKS, HUB-SBY)
                value:
                  email: gudang@mganik.test
                  password: mganik-demo-2026
              storeManager:
                summary: Store manager (TKO-JKS)
                value:
                  email: kepala.jaksel@mganik.test
                  password: mganik-demo-2026
              admin:
                summary: Admin (every permission, all locations)
                value:
                  email: admin@mganik.test
                  password: mganik-demo-2026
              production:
                summary: Production operator (GDP-BKS)
                value:
                  email: produksi@mganik.test
                  password: mganik-demo-2026
      responses:
        "200":
          description: Logged in
          headers:
            Set-Cookie:
              description: "__Host-session=<token>; Path=/; Max-Age=43200; HttpOnly; Secure; SameSite=Lax"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "400":
          description: invalid_request (body is not valid JSON or has unknown fields)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: invalid_credentials (wrong email or password)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: account_disabled or csrf_rejected
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: unsupported_media_type (Content-Type must be application/json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: validation_failed; per-field messages in errors[]
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: too_many_attempts; detail states how many minutes to wait
          headers:
            Retry-After:
              description: Seconds until the client may retry
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: server_busy (concurrent password verification slots are full); retry
          headers:
            Retry-After:
              description: Seconds until the client may retry
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the staff session and clear the cookie
      description: Idempotent; always 204, even when the session has expired or does not exist.
      tags: [auth]
      security:
        - sessionCookie: []
        - {}
      responses:
        "204":
          description: Session revoked (if any) and cookie cleared
        "403":
          description: csrf_rejected (cross-site request)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: unsupported_media_type (Content-Type must be application/json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/me:
    get:
      operationId: getMe
      summary: Current staff profile with roles, permissions, and location scope
      tags: [auth]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: unauthenticated or session_expired
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: forbidden; caller is not staff (e.g. a POS device token)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/public/otp/request:
    post:
      operationId: requestConsumerOtp
      summary: Request a consumer login OTP (mock)
      description: >
        The number is normalized to Indonesian E.164 (+628...). The prototype
        uses a fixed OTP (OTP_MOCK_CODE) that is never returned in the response;
        it is disabled (503 otp_unavailable) in production without the demo
        override. Limited to 5 requests per number and 20 per IP within 15
        minutes.
      tags: [consumer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
            example:
              phone: 081234567890
      responses:
        "202":
          description: Code sent (same response for new and existing numbers)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResponse"
        "403":
          description: csrf_rejected (cross-site request)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: unsupported_media_type (Content-Type must be application/json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: validation_failed; per-field messages in errors[]
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: too_many_attempts; detail states how many minutes to wait
          headers:
            Retry-After:
              description: Seconds until the client may retry
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: otp_unavailable (consumer login is disabled on this server)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/public/otp/verify:
    post:
      operationId: verifyConsumerOtp
      summary: Verify the OTP and create a consumer session
      description: >
        On success, sets the `__Host-consumer` cookie (24 h idle, 7 days
        absolute). At most 5 attempts per code; after that the API returns 429
        too_many_attempts and the consumer must request a new code. An existing
        consumer cookie, if any, is revoked and replaced.
      tags: [consumer]
      security:
        - consumerCookie: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
            example:
              phone: 081234567890
              code: '246810'
      responses:
        "200":
          description: Consumer logged in
          headers:
            Set-Cookie:
              description: "__Host-consumer=<token>; Path=/; Max-Age=604800; HttpOnly; Secure; SameSite=Lax"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerMeResponse"
        "401":
          description: otp_invalid (wrong or expired code)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: consumer_blocked or csrf_rejected
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: unsupported_media_type (Content-Type must be application/json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: validation_failed; per-field messages in errors[]
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: >
            too_many_attempts. Per-IP quota used up: detail states how many
            minutes to wait. Per-code quota used up: detail tells the consumer to
            request a new code.
          headers:
            Retry-After:
              description: Seconds until the client may retry
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: otp_unavailable (consumer login is disabled on this server)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/public/consumer/me:
    get:
      operationId: getConsumerMe
      summary: Current consumer (masked phone number)
      description: Requires the `__Host-consumer` cookie from /public/otp/verify.
      tags: [consumer]
      security:
        - consumerCookie: []
      responses:
        "200":
          description: Consumer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerMeResponse"
        "401":
          description: unauthenticated or session_expired
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/public/consumer/logout:
    post:
      operationId: logoutConsumer
      summary: Revoke the consumer session and clear the cookie
      description: Idempotent; uses the `__Host-consumer` cookie when present.
      tags: [consumer]
      security:
        - consumerCookie: []
        - {}
      responses:
        "204":
          description: Session revoked (if any) and cookie cleared
        "403":
          description: csrf_rejected (cross-site request)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: unsupported_media_type (Content-Type must be application/json)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  # ==== [/iam] ====

  # ==== [serialization] produksi, agregasi, shipment, verifikasi, klaim ====
  /api/v1/code-batches:
    post:
      operationId: mintCodes
      tags: [serialization]
      summary: Mint random 80-bit serial codes (plus claim PINs for UNIT) for one print job
      description: >
        Permission code.mint. Plaintext codes and PINs are returned only once, in
        this response, as input for the print file; the database stores only the
        PIN HMAC.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MintCodesRequest"
            examples:
              units:
                summary: Mint 5 unit codes with claim PINs
                description: 'Needs code.mint: log in as produksi@mganik.test or admin@mganik.test. The response is the only place the PINs appear in plain text (the print file for the label vendor).'
                value:
                  level_code: UNIT
                  qty: 5
                  product_id: 1709c346-10d1-5585-9ef0-7005904214ab
                  printer_vendor: Vendor Label Demo
                  notes: Cetak ulang label yang rusak di lini 1
      responses:
        "201":
          description: Print job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintCodesResponse"
        # Anchor YAML dipakai ulang semua respons error di bagian ini
        # (components.responses berada di luar marker bagian ini).
        "400": &serialProblem
          description: Domain error (problem+json); see the code field
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401": *serialProblem
        "403": *serialProblem
        "422": *serialProblem
  /api/v1/serials/commission:
    post:
      operationId: commissionSerials
      tags: [serialization]
      summary: Bind GENERATED labels to a production batch (→ COMMISSIONED)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommissionRequest"
      responses:
        "200":
          description: Labels commissioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionResponse"
        "401": *serialProblem
        "403": *serialProblem
        "404": *serialProblem
        "409": *serialProblem
        "422": *serialProblem
  /api/v1/serials/receive:
    post:
      operationId: receiveSerials
      tags: [serialization]
      summary: Receive production output (COMMISSIONED → IN_STOCK) into an own location, including descendants
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiveSerialsRequest"
      responses:
        "200":
          description: Serials received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiveSerialsResponse"
        "401": *serialProblem
        "403": *serialProblem
        "404": *serialProblem
        "409": *serialProblem
        "422": *serialProblem
  /api/v1/serials/aggregate:
    post:
      operationId: aggregateSerials
      tags: [serialization]
      summary: Pack units into a carton or cartons into a pallet
      description: >
        Validates level rank, packaging spec, capacity, product, the mixed-batch
        rule, that children have no parent yet, and that there is no cycle.
        Children already in the same parent are skipped (safe to retry).
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AggregateRequest"
      responses:
        "200":
          description: Packed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AggregateResponse"
        "401": *serialProblem
        "403": *serialProblem
        "404": *serialProblem
        "409": *serialProblem
        "422": *serialProblem
  /api/v1/serials/{code}/unpack:
    post:
      operationId: unpackSerial
      tags: [serialization]
      summary: Unpack a container (remove all direct children)
      security: [{ sessionCookie: [] }]
      parameters:
        - &serialCodeParam
          name: code
          in: path
          example: 4WXENVZYGZVNBATA
          required: true
          description: 16-character Crockford Base32 serial code (lowercase and hyphens are normalized)
          schema:
            type: string
      responses:
        "200":
          description: Container unpacked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnpackResponse"
        "401": *serialProblem
        "403": *serialProblem
        "404": *serialProblem
        "409": *serialProblem
  /api/v1/serials/{code}/trace:
    get:
      operationId: traceSerial
      tags: [serialization]
      summary: Serial genealogy (ancestors, descendants, events, shipments, custodian, scans)
      description: >
        Shipments come from the event history (the unit and every carton or
        pallet that ever contained it), so they stay visible after unpacking.
      security: [{ sessionCookie: [] }]
      parameters:
        - *serialCodeParam
      responses:
        "200":
          description: Serial genealogy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceResponse"
        "401": *serialProblem
        "403": *serialProblem
        "404": *serialProblem
  /api/v1/batches/{id}/recall:
    post:
      operationId: recallBatch
      tags: [serialization]
      summary: Recall a batch; units in the supply chain move to QUARANTINED in bulk (idempotent)
      security: [{ sessionCookie: [] }]
      parameters:
        - &serialIdParam
          name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecallRequest"
            example:
              reason: Uji lab menemukan kontaminasi pada lot L2610A
      responses:
        "200":
          description: Batch recalled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallResponse"
        "401": *serialProblem
        "403": *serialProblem
        "404": *serialProblem
        "422": *serialProblem
  /api/v1/shipments:
    post:
      operationId: createSerialShipment
      tags: [serialization]
      summary: Ship pallets, cartons, or units; status and custodian of every descendant move in one statement
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SerialShipmentCreateRequest"
            examples:
              toDistributor:
                summary: Ship carton 4 to the East Java distributor
                description: Log in as admin@mganik.test. The cartons sit inside the pallet, so first run POST /api/v1/serials/4WXENVZYGZVNBATA/unpack (otherwise 409 packed_in_parent). All 12 units move with the carton. After POST /api/v1/shipments/{id}/receive, a consumer scan outside East Java raises OUT_OF_TERRITORY for the distributor leakage index.
                value:
                  from_location_id: 13792935-de43-5ce7-b15b-82c7a923b1fc
                  to_location_id: 6f9f90ed-6526-5dda-9151-33f6c87a3448
                  codes:
                  - AWCKZ55T937HQSS8
