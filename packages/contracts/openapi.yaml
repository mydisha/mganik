    post:
      operationId: claimLoyaltyPoints
      tags: [loyalty]
      summary: Claim points with the PIN inside the package (consumer session)
      description: >
        423 claim_locked after 5 wrong PINs per unit; 409 already_claimed or
        claim_not_allowed (unit not sold yet); 403 claim_previously_rejected when
        this account's claim for the unit was rejected or reversed before; 422
        duplicate_code does not apply (single code). Rate limited per IP and per
        account (429). A repeat claim by the same account returns the existing
