# Menyajikan build SPA dan mem-proxy API ke container `api`.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 6m;

    # Semua add_header di level server. nginx mewarisi add_header ke location
    # hanya kalau location itu tidak punya add_header sendiri, jadi location di
    # bawah tidak memakai add_header. Satu-satunya pengecualian adalah
    # /api/docs/ (Swagger UI), yang menulis ulang SEMUA header di bawah.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Aturan pewarisan yang sama berlaku untuk proxy_set_header dan
    # proxy_hide_header, jadi semuanya juga di level server. Header keamanan
    # dari API disembunyikan supaya tidak terkirim ganda; versi di atas yang berlaku.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # XFF DITIMPA dengan IP peer, bukan ditambah ($proxy_add_x_forwarded_for):
    # nginx adalah satu-satunya proxy, jadi nilai kiriman klien tidak boleh
    # diteruskan (api memercayai XFF hanya dari IP container ini).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_read_timeout 60s;

    # DNS internal Docker; upstream di-resolve ulang kalau container api restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Swagger UI untuk reviewer (aset statis, lihat Dockerfile). Swagger UI
    # memakai atribut style inline, jadi CSP di sini menambah style-src
    # 'unsafe-inline'; script tetap hanya 'self' dan tanpa 'wasm-unsafe-eval'.
    # add_header di sini memutus pewarisan dari level server, jadi keempat
    # header keamanan ditulis ulang. ^~ membuat location ini menang atas proxy
    # /api/ dan location regex.
    location ^~ /api/docs/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        expires -1;
        try_files $uri $uri/ =404;

        # mime.types bawaan tidak mengenal .yaml (jatuh ke octet-stream).
        # Location bersarang mewarisi add_header dan expires dari atas.
        location = /api/docs/openapi.yaml {
            default_type application/yaml;
        }
    }
    # Tanpa garis miring, /api/docs jatuh ke proxy /api/ (404 dari API).
    # Redirect relatif: dengan absolute_redirect bawaan, nginx menulis port 80
    # milik container, bukan port host (8088).
    location = /api/docs {
        absolute_redirect off;
        return 301 /api/docs/;
    }

    location /api/ {
        proxy_pass $api_upstream;
    }
    location = /healthz {
        proxy_pass $api_upstream;
    }
    location = /readyz {
        proxy_pass $api_upstream;
    }

    # Aset ber-hash dari Vite boleh di-cache lama. `expires` bukan add_header,
    # jadi header keamanan di level server tetap diwarisi.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    # Service worker kasir dan manifest selalu divalidasi ulang supaya versi
    # baru langsung terdeteksi; sw.js tidak ber-hash.
    location ~ ^/(sw\.js|manifest\.webmanifest|workbox-[^/]+\.js)$ {
        try_files $uri =404;
        expires -1;
    }

    # Route klien (/console, /pos, /v/:code) jatuh ke index.html.
    location / {
        try_files $uri /index.html;
    }
}
