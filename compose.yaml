name: mganik

# Satu perintah menjalankan seluruh stack:
#
#   docker compose up --build
#
# Urutan: db (sehat) → migrate (one-shot, keluar 0) → api (sehat) → web.
# Web:  http://localhost:${WEB_PORT:-8088}   (SPA + proxy /api ke api)
# API:  http://localhost:${API_PORT:-8089}
# DB:   localhost:${DB_PORT:-55432}           (user/db: mganik)
# Semua port hanya terbuka di 127.0.0.1. Ubah lewat .env (lihat .env.example).

x-api-build: &api-build
  context: ./apps/api

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-production}
  HTTP_ADDR: ":8080"
  DATABASE_URL: postgres://mganik:${POSTGRES_PASSWORD:-mganik}@db:5432/mganik?sslmode=disable
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: json
  # Hanya nginx (container web, IP statis di jaringan proyek) yang dipercaya
  # untuk X-Forwarded-For. Peer lain, termasuk host yang memanggil port API
  # langsung lewat gateway docker, memakai IP peer-nya sendiri.
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-${COMPOSE_WEB_IP:-172.31.250.10}}
  # Kunci HMAC hash PIN klaim (min. 32 byte di production). Default ini hanya
  # untuk demo lokal; ganti lewat .env sebelum stack dibuka ke jaringan lain.
  CLAIM_PEPPER: ${CLAIM_PEPPER:-demo-claim-pepper-ganti-sebelum-dipakai-sungguhan}
  # Kunci induk PII konsumen (enkripsi nomor HP + blind index), min. 32 byte
  # di production. Default demo; aturan sama dengan CLAIM_PEPPER.
  PII_ENC_KEY: ${PII_ENC_KEY:-demo-pii-enc-key-ganti-sebelum-dipakai-sungguhan}
  # Kode OTP mock login konsumen (belum ada pengirim SMS). Hanya untuk demo.
  OTP_MOCK_CODE: ${OTP_MOCK_CODE:-246810}
  # Origin SPA (nginx meneruskan Host tanpa port, jadi origin dicocokkan lewat
  # daftar ini untuk cek CSRF request ber-cookie).
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:${WEB_PORT:-8088},http://127.0.0.1:${WEB_PORT:-8088}}
  # Compose ini adalah stack demo lokal: APP_ENV=production tetapi memakai pepper
  # dan akun demo yang nilainya publik di repo. Config menolak nilai demo di
  # production kecuali izin ini true; api dan migrate menulis WARN saat start.
  # Set false (dan isi secret sendiri) untuk deployment sungguhan.
  SEED_DEMO_ALLOW_PRODUCTION: ${SEED_DEMO_ALLOW_PRODUCTION:-true}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mganik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mganik}
      POSTGRES_DB: mganik
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mganik -d mganik"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    # Nama image mengikuti nama project (default "mganik"), jadi
    # `docker compose -p lain up --build` tidak me-retag image stack utama.
    # migrate dan api berbagi satu image.
    image: ${COMPOSE_PROJECT_NAME}-api:local
    build: *api-build
    # Migrasi lalu isi data demo (idempotent). SEED_DEMO=false = migrasi saja.
    command: ["migrate", "--seed"]
    environment:
      <<: *api-env
      SEED_DEMO: ${SEED_DEMO:-true}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-mganik-demo-2026}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: ${COMPOSE_PROJECT_NAME}-api:local
    build: *api-build
    command: ["serve"]
    environment: *api-env
    ports:
      - "127.0.0.1:${API_PORT:-8089}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 25s

  web:
    image: ${COMPOSE_PROJECT_NAME}-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      default:
        # IP tetap supaya api bisa memercayai XFF hanya dari nginx.
        ipv4_address: ${COMPOSE_WEB_IP:-172.31.250.10}

# Subnet tetap untuk jaringan proyek. IP dinamis container lain diambil dari
# ip_range (separuh atas), jadi IP statis web (separuh bawah) tidak bentrok.
# Kalau subnet bentrok dengan jaringan lain di host, ubah ketiga nilai di .env.
networks:
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-172.31.250.0/24}
          ip_range: ${COMPOSE_IP_RANGE:-172.31.250.128/25}

volumes:
  pgdata:
